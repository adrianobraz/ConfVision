<IfModule mod_ssl.c>
<VirtualHost *:443>
	ServerName franqueado.confmonit2.com.br
#	ServerAlias www.franqueado.confmonit2.com.br

	ServerAdmin suporte@kitsite.com.br
	DocumentRoot /var/www/html/

	<Directory /var/www/html/>
		Options FollowSymLinks
		AllowOverride All
	</Directory>	

	ErrorLog ${APACHE_LOG_DIR}/error.log
        CustomLog ${APACHE_LOG_DIR}/access.log combined
	SSLProxyEngine On
	SSLProxyVerify none
	SSLProxyCheckPeerName off
	SSLProxyCheckPeerCN off

	ProxyPreserveHost On
	ProxyPass / https://127.0.0.1:2003/
	ProxyPassReverse / https://127.0.0.1:2003/

SSLCertificateFile /etc/letsencrypt/live/franqueado.confmonit2.com.br/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/franqueado.confmonit2.com.br/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
