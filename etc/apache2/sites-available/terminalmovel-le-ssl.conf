<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName terminalmovel.confmonit2.com.br

    ProxyPreserveHost On
    ProxyPass /api-comando/ http://10.2.2.102:2030/
    ProxyPassReverse /api-comando/ http://10.2.2.102:2030/
    ProxyPass / http://127.0.0.1:2007/
    ProxyPassReverse / http://127.0.0.1:2007/

    ErrorLog ${APACHE_LOG_DIR}/terminalmovel_error.log
    CustomLog ${APACHE_LOG_DIR}/terminalmovel_access.log combined

SSLCertificateFile /etc/letsencrypt/live/terminalmovel.confmonit2.com.br/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/terminalmovel.confmonit2.com.br/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
