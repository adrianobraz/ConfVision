<!doctype html>
<html lang="pt-br">
    <head>
        {{ template "head" . }}
    </head>
    <body>
        {{ template "variaveis-controle" . }}
        {{ template "nav-bar" . }}

        <div class="container-fluid container-principal">
            <div class="row text-center g-3 py-3 justify-content-center">

                <div class="col-6 col-lg-3">
                    <a href="/carregar-listar-dispositivos-armados" class="fp-menu-card">
                        <i class="bi bi-shield-lock-fill"></i>
                        <span>Alarmes Armados</span>
                        <span class="fp-card-count" id="count-armados">
                            <span class="spinner-border spinner-border-sm"></span>
                        </span>
                    </a>
                </div>
                <div class="col-6 col-lg-3">
                    <a href="/carregar-listar-dispositivos-desarmados" class="fp-menu-card">
                        <i class="bi bi-shield-slash-fill"></i>
                        <span>Alarmes Desarmados</span>
                        <span class="fp-card-count" id="count-desarmados">
                            <span class="spinner-border spinner-border-sm"></span>
                        </span>
                    </a>
                </div>

            </div>
        </div><!-- container -->

        {{ template "link-js" . }}
        <script
            src="/recursos/modulos/relatorio/menu-alarmes/menu-alarmes.js"></script>
    </body>
</html>
