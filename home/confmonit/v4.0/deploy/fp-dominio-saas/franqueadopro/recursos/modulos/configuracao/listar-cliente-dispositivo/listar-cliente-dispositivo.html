<!doctype html>
<html lang="pt-br">

<head>
    {{ template "head" . }}
</head>

<body>
    {{ template "variaveis-controle" . }}
    {{ template "nav-bar" . }}
    {{ template "sub-menu-fluid" }}

    <!-- CONTAINER PRINCIPAL -->
    <div class="container-principal">
        <!-- ROW PRINCIPAL -->
        <div class="row text-center mx-0">

            <!-- COLUNA ESQUERDA -->
            <div id="coluna-esquerda" class="col-lg-12 mt-2 ">

                <div class="mb-2 text-start">
                    <div class="input-group input-group-sm">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <input type="text" id="pesquisar-cliente" autocomplete="off"
                            class="form-control form-control-sm"
                            placeholder="Pesquisar por cliente, conta, dispositivo, CPF, CNPJ ou nick...">
                    </div>
                </div>

                <div class="table-responsive tab-height">
                    <table id="tab-dispositivo" class="table table-sm table-bordered table-striped">
                        <thead class="table-dark">
                            <th style="width: 6%;">Conta</th>
                            <th style="width: 54%;">Cliente</th>
                            <th style="width: 34%;">Dispositivo</th>
                            <th>Ações</th>
                        </thead>
                        <tbody>
                            <!-- preenchido via JS -->
                        </tbody>
                    </table>
                </div>

            </div>
            <!-- /COLUNA ESQUERDA -->


            

        </div>
        <!-- ROW PRINCIPAL -->

    </div>
    <!-- CONTAINER PRINCIPAL -->

    {{ template "link-js" . }}
    <script src="/recursos/modulos/configuracao/listar-cliente-dispositivo/listar-cliente-dispositivo.js"></script>
</body>

</html>
