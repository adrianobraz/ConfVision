<!doctype html>
<html lang="pt-br">

<head>
    {{ template "head" . }}
    <link rel="stylesheet" href="/recursos/modulos/configuracao/gerenciar-procedimento-atendimento/gerenciar-procedimento-atendimento.css">
</head>

<body>
    {{ template "variaveis-controle" . }}
    {{ template "nav-bar" . }}
    {{ template "sub-menu-fluid" }}

    <!-- CONTAINER PRINCIPAL -->
    <div class="container-principal">
        <!-- ROW PRINCIPAL -->
        <div class="row text-center mx-0">

            <!-- COLUNA ESQUERDA -->
            <div id="coluna-direita" class="col-lg-8 mt-2">

                <div class="table-responsive tab-height">
                    <table class="table table-bordered table-sm">
                        <thead class="table-dark">
                            <th style="width: 15%;">grupo</th>
                            <th style="width: 45%;">Procedimento</th>
                            <th style="width: 30%;">Cliente</th>
                            <th colspan="3">Ações</th>
                        </thead>
                        <tbody>
                            <!-- preenchido via JS -->
                        </tbody>

                    </table>
                </div>

            </div><!-- COLUNA ESQUERDA -->


            <!-- COLUNA DIREITA -->
            <div id="coluna-esquerda" class="col-lg-4 mt-1 bg-form page-height">
                <form id="formulario" class="px-4 pt-4">
                    <!-- FORMULARIO -->
                    <div class="table-responsive form-height">
                        <div class="row mx-0">
                            <div class="col-lg-12 mb-1 text-start">
                                <label for="busca-cliente" class="form-label mb-0">
                                    Cliente:
                                </label>
                                <div class="position-relative">
                                    <input type="text" autocomplete="off"
                                        class="form-control form-control-sm text-uppercase"
                                        id="busca-cliente"
                                        placeholder="Pesquisar por nome, CPF, CNPJ ou nick...">
                                    <input type="hidden" id="id-cliente" value="TODOS">
                                    <ul id="lista-clientes" class="fp-combo-list d-none"></ul>
                                </div>
                            </div>

                            <div class="col-lg-12 mb-1 text-start">
                                <label for="grupo-evento-procedimento" class="form-label mb-0">
                                    Grupo:
                                </label>
                                <select type="text" class="form-control form-control-sm
                                    text-uppercase" id="grupo-evento-procedimento">
                                </select>
                            </div>


                            <div class="col-lg-12 mb-1 text-start">
                                <label for="descricao-procedimento" class="form-label mb-0">
                                    Descreva em poucas palavras o procedimento:
                                </label>
                                <textarea type="text" rows="9" maxlength="1200" style="resize: none;" class="form-control form-control-sm
                                    text-uppercase" id="descricao-procedimento"></textarea>
                            </div>
                        </div>

                    </div>
                    <!-- /FORMULARIO -->

                    <!-- CONTROLES -->
                    <div class="row g-3 fp-form-actions mx-0 pb-3">
                        <div class="col-12">
                            <hr class="my-2">
                        </div>
                        <div class="col-12 col-sm-6">
                            <button id="btn-limpar" class="btn btn-danger w-100 fp-btn-form-action" type="button">
                                <i class="bi bi-eraser-fill"></i>
                                &nbsp; Limpar
                            </button>
                        </div>
                        <div class="col-12 col-sm-6">
                            <button id="btn-gravar" class="btn btn-success w-100 fp-btn-form-action" type="button">
                                <i class="bi bi-save-fill"></i>
                                &nbsp; Gravar
                            </button>
                        </div>
                    </div>
                    <!-- /CONTROLES -->


                </form>
            </div><!-- COLUNA DIREITA -->


        </div>
        <!-- /ROW PRINCIPAL -->
    </div>
    <!-- /CONTAINER PRINCIPAL -->

    {{ template "link-js" . }}
    <script
        src="/recursos/modulos/configuracao/gerenciar-procedimento-atendimento/gerenciar-procedimento-atendimento.js"></script>
</body>

</html>
