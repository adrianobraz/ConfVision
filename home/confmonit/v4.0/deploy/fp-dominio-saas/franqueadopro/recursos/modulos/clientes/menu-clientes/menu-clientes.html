<!doctype html>
<html lang="pt-br">
    <head>
        {{ template "head" . }}
    </head>
    <body>
        {{ template "variaveis-controle" . }}
        {{ template "nav-bar" . }}

        <div class="container-fluid container-principal">
            <div class="row text-center g-3 py-3 justify-content-center">

                <div class="col-6 col-lg-3">
                    <a href="/listar-cliente-dispositivo" class="fp-menu-card">
                        <i class="bi bi-card-list"></i>
                        <span>Listar Clientes e Dispositivos</span>
                    </a>
                </div>
                <div class="col-6 col-lg-3">
                    <a href="/carregar-listar-clientes" class="fp-menu-card">
                        <i class="bi bi-people-fill"></i>
                        <span>Lista de Clientes</span>
                    </a>
                </div>
                <div class="col-6 col-lg-3">
                    <a href="/carregar-listar-clientes-ativos" class="fp-menu-card">
                        <i class="bi bi-person-check-fill"></i>
                        <span>Clientes Ativos</span>
                    </a>
                </div>
                <div class="col-6 col-lg-3">
                    <a href="/carregar-listar-clientes-inativos" class="fp-menu-card">
                        <i class="bi bi-person-x-fill"></i>
                        <span>Clientes Inativos</span>
                    </a>
                </div>

            </div>
        </div><!-- container -->

        {{ template "link-js" . }}
    </body>
</html>
