{{ define "pagina" }}
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/public/css/global.css">
    <link rel="stylesheet" href="/public/css/app.css">
    <link rel="stylesheet" href="/public/css/cm-notificacoes.css">
    <link rel="stylesheet" href="/public/css/cm-feedback.css">

    <!-- Icones Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- /Icones Bootstrap -->

    <!-- Jquery -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
    <!-- /Jquery -->

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Calendario -->
    <!-- /Calendario -->
    <script src="/public/js/msg.js"></script>
    <script src="/public/js/global.js"></script>
    <script src="/public/js/cm-notificacoes.js"></script>
    <script src="/public/js/cm-feedback.js"></script>
    <script>
      if (typeof CmNotificacoes !== 'undefined' && location.pathname.indexOf('/login') < 0 && location.pathname !== '/') {
        CmNotificacoes.init({ software: 'webambiente' })
      }
      if (typeof CmFeedback !== 'undefined' && location.pathname.indexOf('/login') < 0 && location.pathname !== '/') {
        CmFeedback.init({ software: 'webambiente' })
      }
    </script>

    <title>{{ .Titulo }}</title>
</head>

<body class="h-screen">

    {{ block "body" . }}{{end}}
</body>

</html>

{{ end }}
