<link rel="stylesheet" href="/assets/modulos/ateControles/ateControles.css">

<div id="ateControles">
    <div id="colEsq" class="col-12 col-sm-2">
        <div id="ateControles_cpTimer" class="bg-success"></div>
    </div>


    <div id="colDir" class="col-12 col-sm-10 ">
        <div id="ateControles_boxBotoes">
            <!-- Gerar ordem de serviço (primeiro ícone) -->
            <div class="click" title="Gerar ordem de servico" onclick="ateControles_abrirOrdemServico()">
                <div class="rounded-3 fmt-botao border border-3 border-dark-subtle">
                    <div class="p-2">
                        <i class="bi bi-tools"></i>
                    </div>
                </div>
            </div>
            <!-- /Gerar ordem de serviço -->

            <!-- Setores -->
            <div class="click" title="Dados do setor do alarme" onclick="modSetores_start(ateEventosDetalhe_start)">
                <div class="rounded-3 fmt-botao border border-3 border-dark-subtle">
                    <div class="p-2">
                        <i class="bi bi-diagram-3-fill"></i>
                    </div>

                </div>
            </div>
            <!-- /Setores -->

            <!-- Usuarios -->
            <div class="click" title="Dados do usuarios do alarme" onclick="modUsuarios_start(ateEventosDetalhe_start)">
                <div class="rounded-3 fmt-botao border border-3 border-dark-subtle">
                    <div class="p-2">
                        <i class="bi bi-people-fill"></i>
                    </div>
                </div>
            </div>
            <!-- /Usuarios -->

            <!-- Grade -->
            <div class="click" title="Grade de horário" onclick="modGrade_start(ateEventosDetalhe_start)">
                <div class="rounded-3 fmt-botao border border-3 border-dark-subtle">
                    <div class="p-2">
                        <i class="bi bi-alarm-fill"></i>
                    </div>
                </div>
            </div>
            <!-- /Grade -->

            <!-- Procedimento -->
            <div class="click" title="Procedimento de atendimento"
                onclick="modProcedimento_start(ateEventosDetalhe_start)">
                <div class="rounded-3 fmt-botao border border-3 border-dark-subtle">
                    <div class="p-2">
                        <i class="bi bi-book-half"></i>
                    </div>
                </div>
            </div>
            <!-- /Procedimento -->

            <!-- Tecnico -->
            <div class="click" title="Dados do técnico" onclick="modTecnico_start(ateEventosDetalhe_start)">
                <div class="rounded-3 fmt-botao border border-3 border-dark-subtle">
                    <div class="p-2">                        
                        <i class="bi bi-file-earmark-text"></i>
                    </div>
                </div>
            </div>
            <!-- /Tecnico -->

            <!-- Viatura -->
            <div class="click" title="Dados da viatura" onclick="modViatura_start(ateEventosDetalhe_start)">
                <div class="rounded-3 fmt-botao border border-3 border-dark-subtle">
                    <div class="p-2">
                        <i class="bi bi-taxi-front-fill"></i>
                    </div>
                </div>
            </div>
            <!-- /Viatura -->

            <!-- Discador -->
            <div class="click" title="Discador" onclick=" modDiscador_start(ateEventosDetalhe_start)">
                <div class="rounded-3 fmt-botao border border-3 border-dark-subtle">
                    <div class="p-2">
                        <i class="bi bi-telephone-fill"></i>
                    </div>
                </div>
            </div>
            <!-- /Discador -->

        </div>

    </div>
