<link rel="stylesheet" href="/assets/modulos/modDiscador/modDiscador.css">

<div id="modDiscador" class="fmt-color">

    <div id="modDiscador_titulo" class="fmt-titulo">
        <div class="py-1">Discador voip</div>
    </div>

    <div id="modDiscador_responsivo" class="table-responsive">

        <div class="col-12 mb-2 px-1">
            <div class="input-group">
                <span class="input-group-text fmt-painel text-bg-success">Senha verbal:</span>
                <input id="modDiscador_cpSenhaVerbal" type="text"
                    class="form-control form-control-sm fmt-campo text-bg-dark" readonly>
            </div>
        </div>

        <div class="col-12 mb-2 px-1">
            <div class="input-group">
                <span class="input-group-text fmt-painel text-bg-success">Contra senha:</span>
                <input id="modDiscador_cpContraSenha" type="text"
                    class="form-control form-control-sm fmt-campo text-bg-dark" readonly>
            </div>
        </div>

        <div class="col-12 mb-2">
            <hr>
        </div>

        <div class="col-12 col-sm-6 mb-2 px-1">
            <div class="input-group">
                <span class="input-group-text fmt-painel text-bg-success box-tel-texto">Telefone 1:</span>

                <input id="modDiscador_cpTelefone1" type="text"
                    class="form-control form-control-sm fmt-campo text-bg-dark text-center" readonly>

                <button id="modDiscador_btnTelefone1" class="btn btn-success box-tel-botao" type="button">Ligar</button>
            </div>
        </div>
        
        <div class="col-12 col-sm-6 mb-2 px-1">
            <div class="input-group">
                <span class="input-group-text fmt-painel text-bg-success box-tel-texto">Telefone 2:</span>

                <input id="modDiscador_cpTelefone2" type="text" class="form-control form-control-sm fmt-campo text-bg-dark text-center" readonly>

                <button id="modDiscador_btnTelefone2" class="btn btn-success box-tel-botao" type="button">Ligar</button>
            </div>
        </div>

        <div class="col-12 mb-2">
            <hr>
        </div>
        
        <div class="col-12 mb-2 px-1">
            <div class="input-group">
                <span class="input-group-text fmt-painel text-bg-success">Nome Supervisor:</span>

                <input id="modDiscador_cpNomeSupervisor" type="text"
                    class="form-control form-control-sm fmt-campo text-bg-dark" readonly>
            </div>
        </div>       

        <div class="col-12 col-sm-6 mb-2 px-1">
            <div class="input-group">
                <span class="input-group-text fmt-painel text-bg-success box-tel-texto">Telefone 1:</span>

                <input id="modDiscador_cpTelefone1Sup" type="text"
                    class="form-control form-control-sm fmt-campo text-bg-dark text-center" readonly>

                <button id="modDiscador_btnTelefone1Sup" class="btn btn-success box-tel-botao" type="button">Ligar</button>
            </div>
        </div>

        <div class="col-12 col-sm-6 mb-2 px-1">
            <div class="input-group">
                <span class="input-group-text fmt-painel text-bg-success box-tel-texto">Telefone 2:</span>

                <input id="modDiscador_cpTelefone2Sup" type="text"
                    class="form-control form-control-sm fmt-campo text-bg-dark text-center" readonly>

                <button id="modDiscador_btnTelefone2Sup" class="btn btn-success box-tel-botao" type="button">Ligar</button>
            </div>
        </div>

        <div class="col-12 mb-2 ">
            <hr>
        </div>

        <div class="col-12 mb-2 px-1">
            <div class="input-group">
                <span class="input-group-text fmt-painel text-bg-success">Alternativo:</span>

                <input id="modDiscador_cpAternativo" type="text"
                    class="form-control form-control-sm fmt-campo text-bg-dark text-center">

                <button id="modDiscador_btnAlternativo" class="btn btn-success" type="button">Ligar</button>
            </div>
        </div>

    </div>

    <div id="modDiscador_boxBtn">
        <button id="modDiscador_btnFechar" class="btn btn-primary text-bg-primary fs-3">
            <i class="bi bi-x-circle"></i>
            &nbsp; Fechar
        </button>
    </div>

</div>
