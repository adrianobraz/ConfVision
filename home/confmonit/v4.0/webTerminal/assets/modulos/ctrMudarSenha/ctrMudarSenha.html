<link rel="stylesheet" href="/assets/modulos/ctrMudarSenha/ctrMudarSenha.css">

<div 
    id="ctrMudarSenha" 
    class="h-100 d-flex flex-column text-center fmt-color"
>
    <div id="ctrMudarSenha_titulo" class="fmt-titulo">
        <div class="py-2">Mudar a senha</div>
    </div>

    <div class="table-responsive mb-2 px-2">
        <div class="col-12 pt-3">
            <label for="ctrMudarSenha_cpSenha" class="form-label fs-3">Entre com a nova senha</label>
            <input id="ctrMudarSenha_cpSenha" type="password" class="form-control text-center fmt-campo">
        </div>

        <div class="col-12 pt-3">
            <label for="ctrMudarSenha_cpSenhaRepitir" class="form-label fs-3">Repita a nova senha</label>
            <input id="ctrMudarSenha_cpSenhaRepitir" type="password" class="form-control text-center fmt-campo">

        </div>
    </div>

    <div class="d-flex h-60 justify-content-evenly px-2">

        <div class="h-60 col-6 mb-1 d-flex ">
            <button id="ctrMudarSenha_btnFechar" class="flex-fill btn btn-warning text-bg-warning fs-3">
                <i class="bi bi-x-circle"></i>
                &nbsp; Fechar
            </button>
        </div>

        <div class="col-6 mb-1 d-flex h-60 mx-1">

            <button id="ctrMudarSenha_btnGravar" class="flex-fill btn btn-primary text-bg-primary fs-3">
                <i class="bi bi-floppy-fill"></i>
                &nbsp; Gravar
            </button>

        </div>
    </div>
</div>
