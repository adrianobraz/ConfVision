<!doctype html>
<html lang="pt-br">
<head>
    {{ template "head" . }}
    <style>
        .cd-uni-wrap {
            min-height: calc(100vh - 160px);
            align-items: stretch;
        }
        .cd-uni-lista {
            height: calc(100vh - 240px);
            overflow-y: auto;
            overflow-x: hidden;
            border: 1px solid var(--fp-border);
            border-radius: 8px;
            background: var(--fp-input-bg);
        }
        .cd-uni-item {
            display: block;
            width: 100%;
            text-align: left;
            border: 0;
            border-bottom: 1px solid var(--fp-border);
            background: transparent;
            color: var(--fp-text);
            padding: .7rem .8rem;
            cursor: pointer;
        }
        .cd-uni-item:hover {
            background: var(--fp-accent-soft);
            color: var(--fp-text);
        }
        .cd-uni-item.ativo {
            background: var(--fp-accent-soft);
            border-left: 3px solid var(--fp-primary);
            color: var(--fp-text);
        }
        .cd-uni-item .titulo {
            font-size: .9rem;
            font-weight: 600;
            color: var(--fp-text);
        }
        .cd-uni-item .meta {
            font-size: .75rem;
            color: var(--fp-text-muted);
            margin-top: .2rem;
            line-height: 1.35;
            word-break: break-word;
        }
        .cd-uni-detalhe {
            height: calc(100vh - 240px);
            overflow-y: auto;
            overflow-x: hidden;
            padding-right: .25rem;
        }
        .cd-uni-empty {
            padding: 2rem 1rem;
            text-align: center;
            color: var(--fp-text-muted);
        }
        .cd-uni-resumo {
            border: 1px solid var(--fp-border);
            border-radius: 8px;
            padding: .85rem 1rem;
            margin-bottom: .85rem;
            background: var(--fp-surface-2);
            color: var(--fp-text);
        }
        .cd-uni-resumo strong {
            display: block;
            margin-bottom: .35rem;
            color: var(--fp-text);
            font-size: 1rem;
        }
        .cd-uni-resumo .small,
        .cd-uni-resumo .text-muted {
            color: var(--fp-text-muted) !important;
        }
        .cd-uni-aviso {
            border: 1px solid var(--fp-border);
            border-radius: 8px;
            padding: .65rem .85rem;
            background: rgba(245, 158, 11, 0.12);
            color: #fbbf24;
            font-size: .85rem;
        }
        .cd-uni-resumo .text-warning {
            color: #fbbf24 !important;
        }
        .cd-uni-ev-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: .55rem .85rem;
        }
        .cd-uni-ev-cell {
            min-width: 0;
        }
        .cd-uni-ev-span2 {
            grid-column: 1 / -1;
        }
        .cd-uni-ev-lab {
            display: block;
            font-size: .7rem;
            text-transform: uppercase;
            letter-spacing: .03em;
            color: var(--fp-text-muted);
            margin-bottom: .1rem;
        }
        .cd-uni-ev-val {
            display: block;
            font-size: .9rem;
            color: var(--fp-text);
            word-break: break-word;
        }
        .cd-uni-ev-inline {
            display: flex;
            flex-wrap: wrap;
            gap: .75rem 1.5rem;
        }
        .cd-uni-ev-inline > div {
            min-width: 0;
        }
        @media (max-width: 768px) {
            .cd-uni-ev-grid { grid-template-columns: 1fr; }
        }

        /* Accordion no tema escuro */
        .cd-uni-painel .accordion-item {
            background: var(--fp-surface-2);
            border: 1px solid var(--fp-border);
            color: var(--fp-text);
            margin-bottom: .4rem;
            border-radius: 8px;
            overflow: hidden;
        }
        .cd-uni-painel .accordion-button {
            font-size: .9rem;
            padding: .6rem .9rem;
            background: var(--fp-surface-2);
            color: var(--fp-text);
            box-shadow: none;
        }
        .cd-uni-painel .accordion-button:not(.collapsed) {
            background: var(--fp-accent-soft);
            color: var(--fp-accent-text);
            box-shadow: none;
        }
        .cd-uni-painel .accordion-button:focus {
            box-shadow: none;
            border-color: var(--fp-border);
        }
        .cd-uni-painel .accordion-button::after {
            filter: invert(1) brightness(1.4);
        }
        .cd-uni-painel .accordion-button .badge {
            font-weight: 500;
        }
        .cd-uni-painel .accordion-body {
            background: var(--fp-input-bg);
            color: var(--fp-text);
            border-top: 1px solid var(--fp-border);
        }
        .cd-uni-painel .accordion-body .text-muted {
            color: var(--fp-text-muted) !important;
        }

        /* Tabelas internas legíveis no dark */
        .cd-uni-painel table {
            font-size: .8rem;
            margin-bottom: 0;
            color: var(--fp-text);
            --bs-table-bg: transparent;
            --bs-table-color: var(--fp-text);
            --bs-table-border-color: var(--fp-border);
            --bs-table-striped-bg: rgba(255, 255, 255, 0.04);
            --bs-table-striped-color: var(--fp-text);
            --bs-table-hover-bg: rgba(255, 255, 255, 0.06);
            --bs-table-hover-color: var(--fp-text);
        }
        .cd-uni-painel table thead th {
            background: var(--fp-surface-2) !important;
            color: var(--fp-text) !important;
            border-color: var(--fp-border) !important;
            white-space: nowrap;
        }
        .cd-uni-painel table tbody td {
            background: transparent !important;
            color: var(--fp-text) !important;
            border-color: var(--fp-border) !important;
            vertical-align: middle;
        }
        .cd-uni-painel audio {
            filter: none;
            background: var(--fp-surface-2);
            border-radius: 4px;
        }
        .cd-td-transcript { max-width: 160px; width: 160px; vertical-align: middle; }
        .cd-tr-cell {
            display: flex;
            align-items: center;
            gap: .35rem;
            max-width: 160px;
        }
        .cd-tr-preview {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: .85rem;
            cursor: pointer;
        }
        .cd-tr-cell .btn-cd-transcript {
            flex-shrink: 0;
            padding: .15rem .4rem;
            line-height: 1;
        }
        .cd-td-audio { min-width: 320px; width: 340px; vertical-align: middle; }
        .cd-audio-cell {
            display: flex;
            flex-direction: column;
            gap: .35rem;
            min-width: 300px;
        }
        .cd-audio-player {
            width: 100%;
            min-width: 280px;
            height: 40px;
        }
        .cd-tr-modal-body {
            white-space: pre-wrap;
            word-break: break-word;
            font-family: inherit;
            font-size: .95rem;
            line-height: 1.45;
            color: inherit;
            background: transparent;
            border: 0;
        }
    </style>
</head>
<body>
    {{ template "variaveis-controle" . }}
    {{ template "nav-bar" . }}
    <div class="container-fluid container-principal pt-2">
        <form id="formulario"></form>
        <div class="row text-center">

            <div class="col-lg-4 mb-1 text-start" id="filtro-cliente-wrap">
                <label for="busca-cliente" class="form-label mb-0">Cliente:</label>
                <div class="position-relative">
                    <input type="text" autocomplete="off" autofocus
                        class="form-control form-control-sm text-uppercase"
                        id="busca-cliente"
                        placeholder="Pesquisar por nome, CPF, CNPJ ou nick...">
                    <input type="hidden" form="formulario" id="id-cliente" value="0">
                    <ul id="lista-clientes" class="fp-combo-list d-none"></ul>
                </div>
            </div>

            <div class="col-lg-2 mb-1 text-start">
                <label for="start" class="form-label mb-0">Data Inicial:</label>
                <input type="text" autocomplete="off"
                    class="form-control form-control-sm" form="formulario" id="start"
                    placeholder="dd/mm/aaaa hh:mm">
            </div>

            <div class="col-lg-2 mb-1 text-start">
                <label for="end" class="form-label mb-0">Data Final:</label>
                <input type="text" autocomplete="off"
                    class="form-control form-control-sm" form="formulario" id="end"
                    placeholder="dd/mm/aaaa hh:mm">
            </div>

            <div class="col-lg-1 d-grid gap-2 mb-1">
                <button type="button" id="btn-limpar" class="btn btn-danger">LIMPAR</button>
            </div>
            <div class="col-lg-1 d-grid gap-2 mb-1">
                <button type="button" id="btn-filtrar" class="btn btn-primary">FILTRAR</button>
            </div>
            <div class="col-lg-2 d-grid gap-2 mb-1">
                <span class="form-control form-control-sm bg-transparent border-0 text-muted text-start" id="qtd-registros">Total: 0</span>
            </div>

            <div class="col-lg-12"><hr></div>
        </div>

        <div class="row cd-uni-wrap g-2">
            <div class="col-lg-4">
                <div class="cd-uni-lista" id="cd-uni-lista">
                    <div class="cd-uni-empty" id="cd-uni-lista-empty">Carregando eventos...</div>
                </div>
                <div class="py-2 text-center text-muted small">
                    <span id="cd-uni-loading" class="d-none">
                        <span class="spinner-border spinner-border-sm me-1"></span>Carregando...
                    </span>
                    <span id="cd-uni-fim" class="d-none">Fim dos registros</span>
                </div>
            </div>
            <div class="col-lg-8">
                <div class="cd-uni-detalhe" id="cd-uni-detalhe">
                    <div class="cd-uni-empty">Selecione um evento à esquerda para ver os detalhes.</div>
                </div>
            </div>
        </div>
    </div>
    {{ template "link-js" . }}
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/themes/dark.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/l10n/pt.js"></script>
    <script src="/recursos/modulos/relatorio/relatorios-disparo/relatorio-cd-unificado.js"></script>
</body>
</html>
