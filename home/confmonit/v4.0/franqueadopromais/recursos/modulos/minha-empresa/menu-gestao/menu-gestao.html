<!doctype html>
<html lang="pt-br">
    <head>
        {{ template "head" . }}
    </head>
    <body>
        {{ template "variaveis-controle" . }}
        {{ template "nav-bar" . }}

        <div class="container-fluid container-principal">
            <div class="row text-center g-3 py-3 justify-content-center">

                <div class="col-6 col-lg-3">
                    <a href="/CarregarPaginaDadosMonitoramento" class="fp-menu-card">
                        <i class="bi bi-clipboard-data"></i>
                        <span>Dados do Monitoramento</span>
                    </a>
                </div>
                <div id="botao-cadastro-operador" class="col-6 col-lg-3" hidden>
                    <a href="/CarregarPaginaGerenciarOperador" class="fp-menu-card">
                        <i class="bi bi-person-badge-fill"></i>
                        <span>Cadastrar Operador</span>
                    </a>
                </div>
                <div class="col-6 col-lg-3">
                    <a href="/carregar-meu-plano" class="fp-menu-card">
                        <i class="bi bi-credit-card-fill"></i>
                        <span>Meu Plano</span>
                    </a>
                </div>
                <div class="col-6 col-lg-3">
                    <a href="/carregar-montar-plano" class="fp-menu-card">
                        <i class="bi bi-sliders"></i>
                        <span>Montar Meu Plano</span>
                    </a>
                </div>
                <div class="col-6 col-lg-3">
                    <a href="/carregar-meu-plano?tab=faturas" class="fp-menu-card">
                        <i class="bi bi-receipt"></i>
                        <span>Faturas e Cobrança</span>
                    </a>
                </div>
                <div class="col-6 col-lg-3">
                    <a href="/carregar-whitelabel" class="fp-menu-card" data-fp-lic-chave="whitelabel">
                        <i class="bi bi-palette-fill"></i>
                        <span>White Label</span>
                    </a>
                </div>
                <div class="col-6 col-lg-3">
                    <a href="/carregar-dominio-saas" class="fp-menu-card" data-fp-lic-chave="franqueadopro.saas">
                        <i class="bi bi-globe"></i>
                        <span>Domínio Personalizado</span>
                    </a>
                </div>
                <div id="botao-permissoes-acesso" class="col-6 col-lg-3" data-fp-master="{{if .EhMaster}}S{{else}}N{{end}}"{{if not .EhMaster}} hidden{{end}}>
                    <a href="/carregar-permissoes-acesso" class="fp-menu-card">
                        <i class="bi bi-shield-lock-fill"></i>
                        <span>Permissões de Acesso</span>
                    </a>
                </div>

            </div>
        </div><!-- container -->

        {{ template "link-js" . }}
        <script
            src="/recursos/modulos/minha-empresa/menu-gestao/menu-gestao.js"></script>
    </body>
</html>
