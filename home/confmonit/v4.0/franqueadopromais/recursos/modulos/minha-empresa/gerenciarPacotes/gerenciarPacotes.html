<!doctype html>
<html lang="pt-br">

<head>
    {{ template "head" . }}
    <link rel="stylesheet" href="/recursos/modulos/minha-empresa/gerenciarPacotes/gerenciarPacotes.css">
</head>

<body>
    {{ template "variaveis-controle" . }}
    <input id="id-pacote" type="hidden" value="">
    {{ template "nav-bar" . }}
    {{ template "sub-menu-fluid" }}
    <div class="container-fluid container-principal">
        <div class="row text-center">
            <!-- COLUNA ESQUERDA -->
            <div id="coluna-direita" class="col-lg-5 mt-2">
                <div class="table-responsive altura-fixa tab-height">
                    <table class="table table-bordered table-sm">
                        <thead class="table-dark">
                            <th style="width: 80%;">Nome</th>
                            <th colspan="4">Ações</th>

                        </thead>
                        <tbody>
                            <!-- Preenchido via js -->
                        </tbody>

                    </table>

                </div>
            </div><!-- COLUNA ESQUERDA -->



            <!-- COLUNA DIREITA -->
            <div id="coluna-esquerda" class="col-lg-7 mt-2 bg-form page-height">
                <form id="formulario" class="px-4 pt-4">
                    <div class="table-responsive form-height">
                    <div class="row mx-0">
                        <div class="col-lg-9 text-start">
                            <label for="pacoteNome">
                                Nome:
                            </label>
                            <input type="text" 
                                autofocus 
                                maxlength="50"
                                class="form-control form-control-sm text-uppercase" 
                                id="pacoteNome">
                        </div>

                        <div class="col-lg-3 text-start">
                            <label for="periodo">
                                Peridiocidade:
                            </label>
                            <select class="form-control form-control-sm"
                                id="periodo">
                                <option value="15">QUINZENAL</option>
                                <option value="30">MENSAL</option>
                            </select>
                        </div>


                        <!-- Dados gerais -->
                        <div class="col-lg-12 border-top border-secondary text-center py-3 mt-3">
                            <div class="row ">

                                <div class="col-lg-3 text-start">
                                    <label for="pacoteValor">Valor:</label>
                                    <input type="text" 
                                        class="form-control form-control-sm msk-real2" 
                                        id="pacoteValor"
                                        placeholder="0,00"
                                        title="Insira o valor do pacote">
                                </div>

                                <div class="col-lg-3 text-start">
                                    <label for="pacoteQtdConta">
                                        Contas:
                                    </label>
                                    <input type="text" 
                                        class="form-control form-control-sm" 
                                        id="pacoteQtdConta"
                                        title="Insira a quantidade de contas">
                                </div>

                                <div class="col-lg-3 text-start">
                                    <label for="acoteAdicional">
                                        Adicional:
                                    </label>
                                    <input type="text" 
                                        class="form-control form-control-sm msk-real2" 
                                        id="acoteAdicional"
                                        placeholder="0,00">
                                </div>

                                <div class="col-lg-3 text-start">
                                    <label for="pacoteComissao">
                                        Comissão %:
                                    </label>
                                    <input type="text" 
                                        class="form-control form-control-sm" 
                                        id="pacoteComissao"
                                        placeholder="0,00">
                                </div>

                                <div class="col-lg-4 text-start border-end border-white">
                                    <label for="adicionaisTerminal">
                                        Terminal:
                                    </label>
                                    <select type="text" 
                                        class="form-control form-control-sm" 
                                        id="adicionaisTerminal">
                                        <option value="N">NÃO</option>
                                        <option value="S">SIM</option>
                                    </select>
                                </div>

                                <div class="col-lg-4 text-start">
                                    <label for="adicionaisGrade">
                                        Grade:
                                    </label>
                                    <select type="text" 
                                        class="form-control form-control-sm" 
                                        id="adicionaisGrade">
                                        <option value="N">NÃO</option>
                                        <option value="S">SIM</option>
                                    </select>
                                </div>

                                <div class="col-lg-4 text-start">
                                    <label for="adicionaisGradeValor">Valor:</label>
                                    <input type="text" 
                                        class="form-control form-control-sm msk-real2" 
                                        id="adicionaisGradeValor"
                                        placeholder="0,00"
                                        title="Insira o valor adicional uso grade por cliente">
                                </div>
                            </div>
                        </div>


                        <!-- Atendimento -->
                        <div class="col-lg-6 border-top border-end border-secondary text-center pb-2">
                            <div class="row">
                                <div class="col-lg-12 px-0">
                                    <label class="bg-secondary w-100 text-white border-end border-white">
                                        Atendimento
                                    </label>
                                </div>                               
        
                                <div class="col-lg-6 text-start">
                                    <label for="atendimentoQtd">
                                        Qtd.:
                                    </label>
                                    <input type="text" 
                                        class="form-control form-control-sm"
                                        id="atendimentoQtd">
                                </div>
        
                                <div class="col-lg-6 text-start">
                                    <label for="atendimentoAdicional">
                                        Adicional:
                                    </label>
                                    <input type="text" 
                                        class="form-control form-control-sm msk-real2"
                                        id="atendimentoAdicional"
                                        placeholder="0,00">
                                </div>
                            </div>
                        </div>                        

                        <!-- Email -->
                        <div class="col-lg-6 border-top border-secondary text-center pb-2">
                            <div class="row ">
                                <div class="col-lg-12 px-0">
                                    <label class="bg-secondary w-100 text-white">
                                        Email
                                    </label>
                                </div>
                                <div class="col-lg-3 text-start">
                                    <label for="emailQtd">
                                        Qtd.:
                                    </label>
                                    <input type="text" 
                                        class="form-control form-control-sm"
                                        id="emailQtd">
                                </div>

                                <div class="col-lg-5 text-start">
                                    <label for="emailAdicional">
                                        Adicional:
                                    </label>
                                    <input type="text" class="form-control form-control-sm msk-real2"
                                        id="emailAdicional" placeholder="0,00">
                                </div>

                                <div class="col-lg-4 text-start">
                                    <label for="emailBloquear" class="">
                                        Bloquear:
                                    </label>
                                    <select id="emailBloquear" class="form-control form-control-sm">
                                        <option value="N">NÃO</option>
                                        <option value="S">SIM</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- SMS -->
                        <div class="col-lg-6 border-top border-end border-secondary text-center pb-2">
                            <div class="row">
                                <div class="col-lg-12 px-0">
                                    <label class="bg-secondary w-100 text-white border-end border-white">
                                        SMS
                                    </label>
                                </div>
                                
                                <div class="col-lg-3 text-start">
                                    <label for="smsQtd">
                                        Qtd.:
                                    </label>
                                    <input type="text" 
                                        class="form-control form-control-sm" 
                                        id="smsQtd">
                                </div>

                                <div class="col-lg-5 text-start">
                                    <label for="smsAdicional">
                                        Adicional
                                    </label>
                                    <input type="text" 
                                        class="form-control form-control-sm msk-real2"
                                        id="smsAdicional"
                                        placeholder="0,00">
                                </div>

                                <div class="col-lg-4 ">
                                    <label for="smsBloquear" 
                                        class="text-start">
                                        Bloquear:
                                    </label>
                                    <select class="form-control form-control-sm"
                                        id="smsBloquear">
                                        <option value="N">NÃO</option>
                                        <option value="S">SIM</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- Ligações -->
                        <div class="col-lg-6 border-top border-secondary text-center pb-2">
                            <div class="row">
                                <div class="col-lg-12 px-0">
                                    <label class="bg-secondary w-100 text-white">
                                        Ligações
                                    </label>
                                </div>
                                
                                <div class="col-lg-3 text-start">
                                    <label for="ligacaoQtd">
                                        Qtd.:
                                    </label>
                                    <input type="text" 
                                        class="form-control form-control-sm" 
                                        id="ligacaoQtd">
                                </div>

                                <div class="col-lg-5 text-start">
                                    <label for="ligacaoAdicional">
                                        Adicional:
                                    </label>
                                    <input type="text" 
                                        class="form-control form-control-sm msk-real2"
                                        id="ligacaoAdicional"
                                        placeholder="0,00">
                                </div>

                                <div class="col-lg-4 text-start">
                                    <label for="ligacaoBloquear" class="">
                                        Bloquear:
                                    </label>
                                    <select class="form-control form-control-sm"
                                        id="ligacaoBloquear" >
                                        <option value="N">NÃO</option>
                                        <option value="S">SIM</option>
                                    </select>
                                </div>

                            </div>
                        </div>

                        <div class="col-lg-12">
                            <hr>
                        </div>

                    </div>
                    </div>

                    <div class="row g-3 fp-form-actions mx-0 pb-3">
                        <div class="col-12">
                            <hr class="my-2">
                        </div>
                        <div class="col-12 col-sm-6">
                            <button id="btnLimpar" class="btn btn-danger w-100 fp-btn-form-action"
                                type="button">
                                <i class="bi bi-eraser-fill"></i>
                                &nbsp; Limpar
                            </button>
                        </div>
                        <div class="col-12 col-sm-6">
                            <button id="btnGravar" class="btn btn-success w-100 fp-btn-form-action" type="button">
                                <i class="bi bi-save-fill"></i>
                                &nbsp; Gravar
                            </button>
                        </div>
                    </div>
                </form>
            </div><!-- COLUNA DIREITA -->


        </div>
    </div>

    {{ template "link-js" . }}
    <script src="/recursos/modulos/minha-empresa/gerenciarPacotes/gerenciarPacotes.js"></script>
</body>

</html>
