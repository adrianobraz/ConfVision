<!doctype html>
<html lang="pt-br">

<head>
    {{ template "head" . }}
    <link rel="stylesheet" href="/recursos/modulos/configuracao/gerenciarEnvioEvento/gerenciarEnvioEvento.css">
</head>

<body>
    {{ template "variaveis-controle" . }}
    {{ template "nav-bar" . }}
    <input id="id-setor-alarme" type="hidden" value="">
    {{ template "sub-menu-fluid" }}
    <div class="container-fluid container-principal">
        <div class="row text-center mx-0">

            <!-- COLUNA ESQUERDA — GRID DE GRUPOS -->
            <div id="coluna-esquerda" class="col-lg-8 mt-2">

                <div class="table-responsive tab-height">
                    <table id="tabela-grupos-email" class="table table-sm table-bordered table-striped mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th style="width: 70%;">Grupo</th>
                                <th style="width: 30%;" class="text-center">E-mail</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td class="text-start">ALARME</td>
                                <td class="text-center">
                                    <select id="EmailAlarme" form="formulario"
                                        class="form-control form-control-sm text-center">
                                        <option value="N">NÃO</option>
                                        <option value="S">SIM</option>
                                    </select>
                                </td>
                            </tr>
                            <tr>
                                <td class="text-start">ARME</td>
                                <td class="text-center">
                                    <select id="EmailArme" form="formulario"
                                        class="form-control form-control-sm text-center">
                                        <option value="N">NÃO</option>
                                        <option value="S">SIM</option>
                                    </select>
                                </td>
                            </tr>
                            <tr>
                                <td class="text-start">DESARME</td>
                                <td class="text-center">
                                    <select id="EmailDesarme" form="formulario"
                                        class="form-control form-control-sm text-center">
                                        <option value="N">NÃO</option>
                                        <option value="S">SIM</option>
                                    </select>
                                </td>
                            </tr>
                            <tr>
                                <td class="text-start">EMERGÊNCIA</td>
                                <td class="text-center">
                                    <select id="EmailEmergencia" form="formulario"
                                        class="form-control form-control-sm text-center">
                                        <option value="N">NÃO</option>
                                        <option value="S">SIM</option>
                                    </select>
                                </td>
                            </tr>
                            <tr>
                                <td class="text-start">FALHAS</td>
                                <td class="text-center">
                                    <select id="EmailFalhas" form="formulario"
                                        class="form-control form-control-sm text-center">
                                        <option value="N">NÃO</option>
                                        <option value="S">SIM</option>
                                    </select>
                                </td>
                            </tr>
                            <tr>
                                <td class="text-start">GERAL</td>
                                <td class="text-center">
                                    <select id="EmailGeral" form="formulario"
                                        class="form-control form-control-sm text-center">
                                        <option value="N">NÃO</option>
                                        <option value="S">SIM</option>
                                    </select>
                                </td>
                            </tr>
                            <tr>
                                <td class="text-start">MÉDICO</td>
                                <td class="text-center">
                                    <select id="EmailMedico" form="formulario"
                                        class="form-control form-control-sm text-center">
                                        <option value="N">NÃO</option>
                                        <option value="S">SIM</option>
                                    </select>
                                </td>
                            </tr>
                            <tr>
                                <td class="text-start">PÂNICO</td>
                                <td class="text-center">
                                    <select id="EmailPanico" form="formulario"
                                        class="form-control form-control-sm text-center">
                                        <option value="N">NÃO</option>
                                        <option value="S">SIM</option>
                                    </select>
                                </td>
                            </tr>
                            <tr>
                                <td class="text-start">RESTAURE</td>
                                <td class="text-center">
                                    <select id="EmailRestaure" form="formulario"
                                        class="form-control form-control-sm text-center">
                                        <option value="N">NÃO</option>
                                        <option value="S">SIM</option>
                                    </select>
                                </td>
                            </tr>
                            <tr>
                                <td class="text-start">SETUP</td>
                                <td class="text-center">
                                    <select id="EmailSetup" form="formulario"
                                        class="form-control form-control-sm text-center">
                                        <option value="N">NÃO</option>
                                        <option value="S">SIM</option>
                                    </select>
                                </td>
                            </tr>
                            <tr>
                                <td class="text-start">TESTE</td>
                                <td class="text-center">
                                    <select id="EmailTeste" form="formulario"
                                        class="form-control form-control-sm text-center">
                                        <option value="N">NÃO</option>
                                        <option value="S">SIM</option>
                                    </select>
                                </td>
                            </tr>
                            <tr>
                                <td class="text-start">SEM COMUNICAR</td>
                                <td class="text-center">
                                    <select id="EmailSemComunicar" form="formulario"
                                        class="form-control form-control-sm text-center">
                                        <option value="N">NÃO</option>
                                        <option value="S">SIM</option>
                                    </select>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>
            <!-- /COLUNA ESQUERDA -->

            <!-- COLUNA DIREITA — SELEÇÃO E AÇÕES -->
            <div id="coluna-direita" class="col-lg-4 mt-2 bg-form page-height">
                <form id="formulario" class="px-4 pt-4">
                    <div class="table-responsive form-height">
                        <div class="row mx-0">
                            <div class="col-lg-12 mb-2 text-start">
                                <label for="idCliente" class="form-label mb-0">
                                    Cliente:
                                </label>
                                <select id="idCliente" form="formulario"
                                    class="form-control form-control-sm text-uppercase">
                                    <option value="0">Selecione</option>
                                </select>
                            </div>

                            <div class="col-lg-12 mb-2 text-start">
                                <label for="idDisp" class="form-label mb-0">
                                    Dispositivo:
                                </label>
                                <select id="idDisp" form="formulario"
                                    class="form-control form-control-sm text-uppercase">
                                    <option value="0">Selecione</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="row g-3 fp-form-actions mx-0 pb-3">
                        <div class="col-12">
                            <hr class="my-2">
                        </div>
                        <div class="col-12 col-sm-6">
                            <button id="btn-limpar" class="btn btn-danger w-100 fp-btn-form-action" type="button">
                                <i class="bi bi-eraser-fill"></i>
                                &nbsp; Limpar
                            </button>
                        </div>
                        <div class="col-12 col-sm-6">
                            <button id="btn-gravar" class="btn btn-success w-100 fp-btn-form-action" type="button">
                                <i class="bi bi-save-fill"></i>
                                &nbsp; Gravar
                            </button>
                        </div>
                    </div>
                </form>
            </div>
            <!-- /COLUNA DIREITA -->

        </div>
    </div>

    {{ template "link-js" . }}
    <script src="/recursos/modulos/configuracao/gerenciarEnvioEvento/gerenciarEnvioEvento.js"></script>
</body>

</html>
