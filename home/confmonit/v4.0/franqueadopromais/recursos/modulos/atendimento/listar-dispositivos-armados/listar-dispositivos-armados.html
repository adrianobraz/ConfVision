<!doctype html>
<html lang="pt-br">

<head>
    {{ template "head" . }}
</head>

<body>
    {{ template "variaveis-controle" . }}
    <input id="id-base" type="hidden" value="">
    {{ template "nav-bar" . }}
    <div class="container-fluid container-principal pt-2">
        <div class="row text-center">
            <div class="col-lg-12 mb-2 text-start">
                <div class="input-group input-group-sm">
                    <span class="input-group-text"><i class="bi bi-search"></i></span>
                    <input type="text" id="pesquisar-cliente" autocomplete="off"
                        class="form-control form-control-sm"
                        placeholder="Pesquisar por cliente, conta, dispositivo, CPF, CNPJ ou nick...">
                </div>
            </div>
            <div class="col-lg-12 table-responsive ">
                <table class="table table-bordered table-sm">
                    <thead class="table-dark">
                        <th style="width: 5%;">Conta</th>
                        <th style="width: 25%;">Cliente</th>
                        <th style="width: 25%;">Dispositivo</th>
                        <th style="width: 15%;">Data Arme</th>
                        <th style="width: 30%;" colspan="2">Ultimo Evento</th>
                    </thead>
                    <tbody> <!-- preenchido via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    {{ template "link-js" . }}
    <script src="/recursos/modulos/atendimento/listar-dispositivos-armados/listar-dispositivos-armados.js"></script>
</body>

</html>
