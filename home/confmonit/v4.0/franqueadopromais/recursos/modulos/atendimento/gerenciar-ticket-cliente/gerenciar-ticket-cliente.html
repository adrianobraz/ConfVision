<!doctype html>
<html lang="pt-br">
    <head>
        {{ template "head" . }}
    </head>
    <body>
        {{ template "variaveis-controle" . }}
        {{ template "nav-bar" . }}
        
        {{ template "sub-menu-fluid" }}
        <div class="container-fluid container-principal">
            <div class="row text-center">
                

                <!-- COLUNA ESQUERDA -->
                <div id="coluna-direita" class="col-lg-7 mt-2">
                    <div class="table-responsive">
                        <table class="table table-bordered table-sm">
                            <thead class="table-dark">
                                <th style="width: 40%;">Nome</th>
                                <th style="width: 35%;">Assunto</th>
                                <th style="width: 20%;">Status</th>
                                <th >Ações</th>

                            </thead>
                            <tbody> <!-- preenchido via JS -->
                            </tbody>

                        </table>

                    </div>
                </div><!-- COLUNA ESQUERDA -->


                <!-- COLUNA DIREITA -->
                <div id="coluna-esquerda" class="col-lg-5 mt-2 bg-form">
                    <form id="formulario" class="p-4">
                        <div class="row">
                            <div class="col-lg-12 mb-1 text-start">
                                <label for="start"
                                    class="form-label mb-0">
                                    Cliente:
                                </label>
                                <select autofocus maxlength="50"
                                    class="form-control form-control-sm text-uppercase"
                                    form="formulario"
                                    id="id-cliente"></select>
                                    
                            </div>
                            <div class="col-lg-12 mb-1 text-start">
                                <label for="assunto-ticket"
                                    class="form-label mb-0">
                                    Assunto:
                                </label>
                                <input type="text" autofocus maxlength="60"
                                    class="form-control form-control-sm text-uppercase"
                                    id="assunto-ticket">
                            </div>
                            <div class="col-lg-12 mb-1 text-start">
                                <label for="historico-ticket"
                                    class="form-label mb-0">
                                    Historico:
                                </label>
                                <textarea type="text" rows="8"
                                    style="resize: none;" disabled
                                    class="form-control form-control-sm text-uppercase"
                                    id="historico-ticket"></textarea>
                            </div>
                            <div class="col-lg-12 mb-1 text-start">
                                <label for="descricao-ticket"
                                    class="form-label mb-0">
                                    Descrição:
                                </label>
                                <textarea type="text" rows="3"
                                    style="resize: none;"
                                    class="form-control form-control-sm text-uppercase"
                                    id="descricao-ticket"></textarea>
                            </div>


                            <!-- CONTROLES -->
                            <div class="col-lg-12"><hr></div>
                            <div class="col-12 mb-3 d-grid gap-2 px-1">
                                <button id="btn-limpar"
                                    class="btn btn-lg btn-block btn-danger fs-4 py-4 py-lg-0"
                                    type="button">
                                    <i class="bi bi-eraser-fill fs-2"></i>
                                    &nbsp; Limpar
                                </button>
                            </div>
                            <div class="col-12 mb-3 d-grid gap-2 px-1">
                                <button id="btn-gravar"
                                    class="btn btn-lg btn-success fs-4 py-4 py-lg-0"
                                    type="button">
                                    <i class="bi bi-save-fill fs-2"></i>
                                    &nbsp; Gravar
                                </button>
                            </div>
                            <div class="col-12 mb-3 d-grid gap-2 px-1">
                                <button id="btn-fechar-reabrir"
                                    class="btn btn-lg btn-primary fs-4 py-4 py-lg-0"
                                    type="button">
                                    <i class="bi bi-door-closed-fill fs-2"></i>
                                    &nbsp; Fechar
                                </button>
                            </div>
                            
                            <div class="col-12 mb-3 d-grid gap-2 px-1">
                                <button id="btnImprimir"
                                    class="btn btn-lg btn-primary fs-4 py-4 py-lg-0"
                                    type="button">
                                    <i class="bi bi-printer-fill"></i>
                                    &nbsp; Imprimir
                                </button>
                            </div>
                        </div>
                    </form>
                </div><!-- COLUNA DIREITA -->
                

            </div>
        </div>

        {{ template "link-js" . }}
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
        <script
            src="/recursos/modulos/atendimento/gerenciar-ticket-cliente/gerenciar-ticket-cliente.js"></script>
    </body>
</html>
