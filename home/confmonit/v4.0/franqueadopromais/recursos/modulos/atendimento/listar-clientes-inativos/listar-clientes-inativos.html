<!doctype html>
<html lang="pt-br">
    <head>
        {{ template "head" . }}
    </head>
    <body>
        {{ template "variaveis-controle" . }}
        <input id="id-base" type="hidden" value="">
        {{ template "nav-bar" . }}
        <div class="container-fluid container-principal pt-2">
            <div class="row text-center ">
                <div class="col-lg-12 mb-2 text-start">
                    <div class="input-group input-group-sm">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <input type="text" id="pesquisar-cliente" autocomplete="off"
                            class="form-control form-control-sm"
                            placeholder="Pesquisar por nome, CPF, CNPJ ou nick...">
                    </div>
                </div>
                <div class="col-lg-12 table-responsive">
                    <table class="table table-bordered table-sm">
                        <thead class="table-dark">
                            <tr>
                                <th colspan="6" class="fs-3">
                                    Lista de Clientes Inativos
                                </th>
                            </tr>
                            <tr>
                                <th style="width: 35%;">Nome do Cliente</th>
                                <th style="width: 15%;">CPF/CNPJ</th>
                                <th style="width: 15%;">Telefone</th>
                                <th style="width: 15%;">Celular</th>
                                <th style="width: 20%;">Email</th>
                            </tr>
                        </thead>
                        <tbody> <!-- preenchido via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        {{ template "link-js" . }}
        <script
            src="/recursos/modulos/atendimento/listar-clientes-inativos/listar-clientes-inativos.js"></script>
    </body>
</html>
