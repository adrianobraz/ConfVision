<!doctype html>
<html lang="pt-br">

<head>
    {{ template "head" . }}
    <link rel="stylesheet" href="/recursos/modulos/configuracao/gerenciar-setores-alarme/gerenciar-setores-alarme.css">
</head>

<body>
    {{ template "variaveis-controle" . }}
    {{ template "nav-bar" . }}
    <input id="id-setor-alarme" type="hidden" value="">
    {{ template "sub-menu-fluid" }}
    <!-- CONTAINER PRINCIPAL -->
    <div class="container-principal">

        <!-- ROW PRINCIPAL -->
        <div class="row text-center mx-0">

            <!-- COLUNA ESQUERDA -->
            <div id="coluna-esquerda" class="col-lg-8 mt-2 ">

                <div class="table-responsive tab-height">
                    <table class="table table-sm table-bordered table-striped">
                        <thead class="table-dark">
                            <th style="width: 8%;">Numero</th>
                            <th style="width: 8%;">Particao</th>
                            <th style="width: 42%;">Nome</th>
                            <th style="width: 22%;">Tipo</th>
                            <th colspan="3">Ações</th>

                        </thead>
                        <tbody>
                            <!-- preenchido via JS -->
                        </tbody>
                    </table>
                </div>

            </div>
            <!-- /COLUNA ESQUERDA -->

            <!-- COLUNA DIREITA -->
            <div id="coluna-direita" class="col-lg-4 mt-2 bg-form page-height">
                <form id="formulario" class="px-4 pt-4">
                    <!-- FORMULARIO -->
                    <div class="table-responsive form-height">
                        <div class="row mx-0">

                            <div class="col-lg-12 mb-1 text-start">
                                <label for="busca-cliente" class="form-label mb-0">
                                    Cliente:
                                </label>
                                <div class="position-relative">
                                    <input type="text" autocomplete="off"
                                        class="form-control form-control-sm text-uppercase"
                                        id="busca-cliente"
                                        placeholder="Pesquisar por nome, CPF, CNPJ ou nick...">
                                    <input type="hidden" id="id-cliente" value="0">
                                    <ul id="lista-clientes" class="fp-combo-list d-none"></ul>
                                </div>
                            </div>

                            <div class="col-lg-12 mb-1 text-start">
                                <label for="id-dispositivo" class="form-label mb-0">
                                    Dispositivo:
                                </label>
                                <select type="text" class="form-control form-control-sm text-uppercase"
                                    id="id-dispositivo">
                                    <option value="0">SELECIONE</option>
                                </select>
                            </div>

                            <div class="col-lg-4 mb-1 text-start">
                                <label for="numero-setor-alarme" class="form-label mb-0">
                                    Setor:
                                </label>
                                <input type="text" disabled class="form-control form-control-sm
                                    text-uppercase text-center msk-setor" id="numero-setor-alarme">
                            </div>                           

                            <div class="col-lg-4 mb-1 text-start">
                                <label for="setor-com-camera" class="form-label mb-0">
                                    Camera:
                                </label>
                                <select type="text" disabled class="form-control form-control-sm
                                    text-uppercase text-center" id="setor-com-camera">
                                    <option value="N">NÃO</option>
                                    <option value="S">SIM</option>
                                </select>
                            </div>

                            <div class="col-lg-4 mb-1 text-start">
                                <label for="tipo-area-setor-alarme" class="form-label mb-0">
                                    Tipo Área:
                                </label>
                                <select type="text" disabled class="form-control form-control-sm
                                    text-uppercase text-center" id="tipo-area-setor-alarme">
                                    <option value="ÁREA INTERNA">INTERNA</option>
                                    <option value="ÁREA EXTERNA">EXTERNA</option>
                                </select>
                            </div>

                            <div class="col-lg-12 mb-1 text-start">
                                <label for="nome-setor-alarme" class="form-label mb-0">
                                    Nome:
                                </label>
                                <input type="text" maxlength="50" disabled class="form-control form-control-sm
                                    text-uppercase text-center" id="nome-setor-alarme">
                            </div>

                            <div class="col-lg-12 mb-1 text-start">
                                <label for="descricao-setor-alarme" class="form-label mb-0">
                                    Descrição:
                                </label>
                                <textarea type="text" maxlength="100" rows="3" disabled class="form-control form-control-sm
                                    text-uppercase" id="descricao-setor-alarme"></textarea>
                            </div>

                        </div>
                    </div>
                    <!-- FORMULARIO -->

                    <!-- CONTROLES -->
                    <div class="row g-3 fp-form-actions mx-0 pb-3">
                        <div class="col-12">
                            <hr class="my-2">
                        </div>
                        <div class="col-12 col-sm-6">
                            <button id="btn-limpar" class="btn btn-danger w-100 fp-btn-form-action" type="button">
                                <i class="bi bi-eraser-fill"></i>
                                &nbsp; Limpar
                            </button>
                        </div>
                        <div class="col-12 col-sm-6">
                            <button id="btn-gravar" class="btn btn-success w-100 fp-btn-form-action" type="button">
                                <i class="bi bi-save-fill"></i>
                                &nbsp; Gravar
                            </button>
                        </div>
                    </div>
                    <!-- /CONTROLES -->

                </form>
            </div>
            <!-- COLUNA DIREITA -->

        </div>
        <!-- /ROW PRINCIPAL -->

    </div>
    <!-- /CONTAINER PRINCIPAL -->

    {{ template "link-js" . }}
    <script src="/recursos/modulos/configuracao/gerenciar-setores-alarme/gerenciar-setores-alarme.js"></script>
</body>

</html>
