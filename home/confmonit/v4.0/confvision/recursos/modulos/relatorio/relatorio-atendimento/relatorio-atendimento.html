<!doctype html>
<html lang="pt-br">

    <head>
        {{ template "head" . }}

    </head>

    <body>
        {{ template "variaveis-controle" . }}
        {{ template "nav-bar" . }}
        {{ template "sub-menu" }}
        <div class="container container-principal pt-2">
            <form id="formulario"></form>
            <div class="row text-center">

                <div class="col-lg-5 mb-1 text-start">
                    <label for="id-cliente" class="form-label mb-0">
                        Cliente:
                    </label>
                    <select type="text" autofocus maxlength="50"
                        class="form-control form-control-sm text-uppercase"
                        form="formulario" id="id-cliente"></select>

                </div>

                <div class="col-lg-7 mb-1 text-start">
                    <label for="id-dispositivos" class="form-label mb-0">
                        Dispositivo:
                    </label>
                    <select type="text" autofocus maxlength="50"
                        class="form-control form-control-sm text-uppercase"
                        form="formulario" id="id-dispositivos">
                        <option value="0">SELECIONE UM DISPOSITIVO</option>
                    </select>

                </div>

                <!--div class="col-lg-2 mb-1 text-start">
                    <label for="id-dispositivos" class="form-label mb-0">
                        Mostra Aten. Auto:
                    </label>
                    <select

                        class="form-control form-control-sm text-uppercase"
                        form="formulario" 
                        id="atendimento-auto">
                        <option value="0">NÃO</option>
                        <option value="1">SIM</option>
                    </select>
                </div-->

                

                <div class="col-lg-2 mb-1 text-start">
                    <label for="start" class="form-label mb-0">
                        Data Inicial:
                    </label>
                    <input type="datetime-local" autofocus 
                        class="form-control form-control-sm  text-uppercase"
                        form="formulario" id="start">
                </div>

                <div class="col-lg-2 mb-1 text-start">
                    <label for="end" class="form-label mb-0">
                        Data Final:
                    </label>
                    <input type="datetime-local" autofocus maxlength="50"
                        class="form-control form-control-sm text-uppercase"
                        form="formulario" id="end">
                </div>
                
                <div class="col-lg-2 d-grid gap-2 mb-1 mt-1">
                    <button id="btn-limpar" class="btn btn-danger">LIMPAR</button>
                </div>

                <div class="col-lg-2 d-grid gap-2 mb-1 mt-1 ">
                    <button id="btn-filtrar" class="btn btn-primary">FILTRAR</button>
                </div>

                <div class="col-lg-4 d-grid gap-2 mb-1 mt-1">
                    <button id="btn-imprimir" class="btn btn-primary">IMPRIMIR
                        RELATÓRIO</button>
                </div>

                <div class="col-lg-12">
                    <hr>
                </div>

                <div class="col-lg-12 table-responsive ">
                    <table class="table table-bordered table-sm "
                        id="tabEventos">
                        <tbody>
                            <!-- preenchido via JS -->

                        </tbody>
                    </table>
                </div>

            </div>
        </div>
        {{ template "link-js" . }}
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.1/jspdf.plugin.autotable.min.js"></script>
        <script src="/recursos/js/auxiliares/geraTabelaPdf.js"></script>
        <script
            src="/recursos/modulos/relatorio/relatorio-atendimento/relatorio-atendimento.js"></script>
    </body>

</html>
