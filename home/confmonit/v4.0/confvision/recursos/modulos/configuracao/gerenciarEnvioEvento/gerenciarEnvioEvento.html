<!doctype html>
<html lang="pt-br">

<head>
    {{ template "head" . }}
</head>

<body>
    {{ template "variaveis-controle" . }}
    {{ template "nav-bar" . }}
    <input id="id-setor-alarme" type="hidden" value="">
    {{ template "sub-menu-fluid" }}
    <!-- CONTAINER PRINCIPAL -->
    <div class="container-principal">

        <!-- ROW PRINCIPAL -->
        <div class="row text-center mx-0">           

            <div id="colEsq" class="col-lg-3 p-2 bg-form">
                <div class="row">
                    <div class="col-lg-12 text-start">
                        <label 
                            for="idCliente" 
                            class="form-label mb-0">
                            Cliente:
                        </label>
                        <select 
                            id="idCliente"
                            type="text" 
                            form="formulario"
                            class="form-control form-control-sm text-uppercase"
                        ></select>                        
                    </div> 

                    <div class="col-lg-12 text-start mb-2">
                        <label 
                            for="idDisp" 
                            class="form-label mb-0">
                            Dispositivo:
                        </label>
                        <select 
                            id="idDisp"
                            type="text" 
                            form="formulario"
                            class="form-control form-control-sm text-uppercase"
                        ></select>                        
                    </div>   

                    <div class="col-lg-12">
                        <hr>
                    </div>

                    <div class="col-12 d-grid mb-2 gap-2">
                        <button id="btn-limpar" class="btn btn-lg btn-block btn-danger
                                fs-2 py-4 py-lg-0" type="button">
                            <i class="bi bi-eraser-fill fs-2"></i>
                            &nbsp; Limpar
                        </button>
                    </div>
                    <div class="col-12 d-grid gap-2">
                        <button id="btn-gravar" class="btn btn-lg btn-success fs-2 py-4
                                py-lg-0" type="button">
                            <i class="bi bi-save-fill fs-2"></i>
                            &nbsp; Gravar
                        </button>
                    </div>
                </div>
            </div>

            <div id="colDir" class="col-lg-9">
                <div class="row">
                    <form id="formulario" class="px-4 pt-1 bg-form page-height">
                        
                        <div id="RowGrupo" class="row">
                            <div class="col-sm-2 text-center pb-1">
                                <label for="">GRUPO</label>
                            </div>
                            
                            <div class="col-sm-1 text-center pb-1">
                                <label for="">EMAIL</label>
                            </div>
                            
                        </div>
        
                        <div id="RowAlarme" class="row bg-secondary text-white">
                            <div class="col-sm-2 text-end pb-1">
                                <label for="EmailAlarme">ALARME:</label>
                            </div>
                            <div class="col-sm-1 text-center">
                                <select 
                                    id="EmailAlarme" 
                                    class="form-control form-control-sm text-center" >
                                    
                                    <option value="N">NÃO</option>
                                    <option value="S">SIM</option>
                                </select>
                            </div>                    
                        </div>
        
                        <div id="RowArme" class="row">
                            <div class="col-sm-2 text-end pb-1">
                                <label for="EmailArme">ARME:</label>
                            </div>
                            <div class="col-sm-1 text-center">
                                <select 
                                    id="EmailArme"
                                    class="form-control form-control-sm text-center" >
                                    <option value="N">NÃO</option>
                                    <option value="S">SIM</option>
                                </select>
                            </div>
                        </div>
                        
                        <div id="RowDesarme" class="row bg-secondary text-white">
                            <div class="col-sm-2 text-end pb-1">
                                <label for="EmailDesarme">DESARME:</label>
                            </div>
                            <div class="col-sm-1 text-center">
                                <select id="EmailDesarme"
                                    class="form-control form-control-sm text-center">
                                    <option value="N">NÃO</option>
                                    <option value="S">SIM</option>
                                </select>
                            </div>
                        </div>
        
                        <div id="RowEmergencia" class="row">
                            <div class="col-sm-2 text-end pt-1">
                                <label for="EmailEmergencia">EMERGÊNCIA:</label> 
                            </div>
                            <div class="col-sm-1 text-center">
                                <select id="EmailEmergencia"
                                    class="form-control form-control-sm text-center">
                                    <option value="N">NÃO</option>
                                    <option value="S">SIM</option>
                                </select>
                            </div>
                        </div>
        
                        <div id="RowFalhas" class="row bg-secondary text-white">
                            <div class="col-sm-2 text-end pt-1">
                                <label for="EmailFalhas"> FALHAS:</label> 
                            </div>
                            <div class="col-sm-1 text-center">
                                <select id="EmailFalhas"
                                    class="form-control form-control-sm text-center">
                                    <option value="N">NÃO</option>
                                    <option value="S">SIM</option>
                                </select>
                            </div>
                        </div>
        
                        <div id="RowGeral" class="row">
                            <div class="col-sm-2 text-end pt-1">
                                <label for="EmailGeral">GERAL:</label>
                            </div>
                            <div class="col-sm-1 text-center">
                                <select id="EmailGeral"
                                    class="form-control form-control-sm text-center">
                                    <option value="N">NÃO</option>
                                    <option value="S">SIM</option>
                                </select>
                            </div>
                        </div>
        
                        <div id="RowMedico" class="row bg-secondary text-white">
                            <div class="col-sm-2 text-end pt-1">
                                <label for="EmailMedico">MEDICO:</label> 
                            </div>
                            <div class="col-sm-1 text-center">
                                <select id="EmailMedico"
                                    class="form-control form-control-sm text-center">
                                    <option value="N">NÃO</option>
                                    <option value="S">SIM</option>
                                </select>
                            </div>
                        </div>
        
                        <div id="RowPanico" class="row">
                            <div class="col-sm-2 text-end pt-1">
                                <label for="EmailPanico">PANICO:</label> 
                            </div>
                            <div class="col-sm-1 text-center">
                                <select id="EmailPanico"
                                    class="form-control form-control-sm text-center">
                                    <option value="N">NÃO</option>
                                    <option value="S">SIM</option>
                                </select>
                            </div>
                        </div>
        
                        <div id="RowRestaure" class="row bg-secondary text-white">
                            <div class="col-sm-2 text-end pt-1">
                                <label for="EmailRestaure">RESTAURE:</label> 
                            </div>
                            <div class="col-sm-1 text-center">
                                <select id="EmailRestaure" 
                                    class="form-control form-control-sm text-center">
                                    <option value="N">NÃO</option>
                                    <option value="S">SIM</option>
                                </select>
                            </div>
                        </div>
        
                        <div id="RowSetup" class="row">
                            <div class="col-sm-2 text-end pt-1">
                                <label for="EmailSetup">SETUP:</label> 
                            </div>
                            <div class="col-sm-1 text-center">
                                <select id="EmailSetup" 
                                    class="form-control form-control-sm text-center">
                                    <option value="N">NÃO</option>
                                    <option value="S">SIM</option>
                                </select>
                            </div>
                        </div>
        
                        <div id="RowTeste" class="row bg-secondary text-white">
                            <div class="col-sm-2 text-end pt-1">
                                <label for="EmailTeste">TESTE:</label> 
                            </div>
                            <div class="col-sm-1 text-center">
                                <select id="EmailTeste"
                                    class="form-control form-control-sm text-center">
                                    <option value="N">NÃO</option>
                                    <option value="S">SIM</option>
                                </select>
                            </div>
                        </div>
                        
                        
        
                        
        
                    </form>
                </div>
            </div>
            

        </div>
        <!-- /ROW PRINCIPAL -->

    </div>
    <!-- /CONTAINER PRINCIPAL -->

    {{ template "link-js" . }}
    <script src="/recursos/modulos/configuracao/gerenciarEnvioEvento/gerenciarEnvioEvento.js"></script>
</body>

</html>
