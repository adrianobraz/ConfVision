<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.TituloSite}}</title>

    <link rel="apple-touch-icon" sizes="180x180" href="/recursos/img/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/recursos/img/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/recursos/img/favicon/favicon-16x16.png">
    <link rel="manifest" href="/recursos/img/favicon/site.webmanifest">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="/recursos/js/auxiliares/cv-theme.js?v=20260731presets2"></script>
    <link rel="stylesheet" href="/recursos/css/login.css?v=20260731theme3">
</head>
<body class="login-page">

    <div class="login-bg"></div>

    <main class="login-wrap">
        <div class="login-card">
            <div class="login-brand">
                <img
                    src="/recursos/img/brand/logo-confvision-vertical-white.png"
                    alt="Logo"
                    class="login-logo"
                    id="login-logo">
                <p class="login-tagline">Central de Câmeras</p>
                {{ if .IdFranqueadoWhitelabel }}
                <input type="hidden" id="cv-tenant-franqueado" value="{{ .IdFranqueadoWhitelabel }}">
                {{ end }}
            </div>

            <form class="login-form" id="form-login" autocomplete="on">
                <div class="login-field">
                    <label class="login-label" for="email">E-mail</label>
                    <div class="login-input-wrap">
                        <i class="bi bi-envelope login-input-icon" aria-hidden="true"></i>
                        <input
                            type="email"
                            name="email"
                            id="email"
                            class="login-input"
                            placeholder="seu@email.com"
                            autocomplete="username"
                            required>
                    </div>
                </div>

                <div class="login-field">
                    <label class="login-label" for="senha">Senha</label>
                    <div class="login-input-wrap">
                        <i class="bi bi-lock login-input-icon" aria-hidden="true"></i>
                        <input
                            type="password"
                            name="senha"
                            id="senha"
                            class="login-input"
                            placeholder="••••••••"
                            autocomplete="current-password"
                            required>
                    </div>
                </div>

                <button id="btn-logar" type="button" class="login-btn">
                    Entrar
                    <i class="bi bi-arrow-right-short" aria-hidden="true"></i>
                </button>
            </form>
        </div>

        <p class="login-footer">&copy; <span class="cv-brand-footer">Central de Câmeras</span></p>
    </main>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"
        integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4="
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/recursos/js/auxiliares/cv-msg.js?v=20260731msg1"></script>
    <script src="/recursos/js/auxiliares/cv-whitelabel.js?v=20260731cache1"></script>
    <script src="/recursos/modulos/login/login.js?v=20260731cache1"></script>
    <script src="/recursos/js/auxiliares/box-mensagem-padrao.js"></script>
</body>
</html>
