<!doctype html>
<html lang="pt-br">
<head>
    {{ template "head" . }}
    {{ template "confvision-head-extra" . }}
</head>
<body class="cv-app cv-rtmp-page">
    {{ template "variaveis-controle" . }}
    {{ template "confvision-config" . }}
    {{ template "confvision-nav" . }}

    <main class="cv-main cv-main-wide">
        <div class="cv-panel">
            <div class="cv-panel-toolbar">
                <div>
                    <h1 class="cv-page-title mb-0">Relatório operacional</h1>
                    <p class="cv-page-desc mb-0">Stream/RTMP, health e métricas salvos (coleta ~30 min)</p>
                </div>
                <button type="button" id="btn-atualizar-relatorio-op" class="cv-btn-ghost" title="Atualizar">
                    <i class="bi bi-arrow-clockwise"></i> Atualizar
                </button>
            </div>

            <ul class="nav nav-tabs cv-form-tabs cv-rtmp-tabs mb-2" id="rel-op-tabs" role="tablist">
                <li class="nav-item"><button class="nav-link active" type="button" data-rel-tab="stream">Stream</button></li>
                <li class="nav-item"><button class="nav-link" type="button" data-rel-tab="health">Health</button></li>
                <li class="nav-item"><button class="nav-link" type="button" data-rel-tab="metric">Métricas</button></li>
            </ul>

            <div class="table-responsive cv-table-wrap">
                <table class="cv-table cv-table-stack">
                    <tbody id="tab-rel-op-body">
                        <tr><td><div class="cv-empty">Carregando…</div></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="/recursos/modulos/confvision/relatorio-operacional.js"></script>
</body>
</html>
