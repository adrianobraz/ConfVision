{{ template "pagina" . }}

{{ define "body" }}
<div class="min-h-full w-full flex-col">
    {{ template "navbar" . }}

    <div id="linha-1" class="w-full flex flex-col md:flex-row md:items-center gap-2 p-2 font-bold">

        <div class="md:w-4/12 flex flex-wrap gap-2">
            <div class="w-full">
                <label for="dispositivo" class="ps-2 font-black">
                    Dispositivo:
                </label>
                <select id="dispositivo" type="text"
                    class="w-full px-3 py-2 rounded-md text-center focus:outline-none text-slate-700 uppercase">
                </select>
            </div>

            <div class="w-full flex gap-2">

                <button id="btnLimpar" class="w-1/2 py-4 rounded-md text-white font-black  bg-yellow-400">
                    <i class="bi bi-floppy-fill"></i> &nbsp;
                    Limpar
                </button>

                <button id="btnGravar" class="w-1/2 py-4 rounded-md text-white font-black  bg-green-700">
                    <i class="bi bi-floppy-fill"></i> &nbsp;
                    Gravar
                </button>
            </div>
        </div>

        <div class="md:w-8/12 ">
            <label for="msg" class="ps-2 font-black">
                Mensangem (max 500 caracteres):
            </label>
            <textarea id="msg" rows="17" maxlength="500"
                class="w-full px-3 py-2 rounded-md focus:outline-none text-slate-700 "></textarea>
        </div>


    </div>

    <div id="linha-2" class="w-full flex flex-col md:flex-row md:items-center gap-2 p-2 font-bold text-3xl">


    </div>

</div>


<script src="/public/templates/msgAtendente/msgAtendente.js"></script>
{{ end }}
