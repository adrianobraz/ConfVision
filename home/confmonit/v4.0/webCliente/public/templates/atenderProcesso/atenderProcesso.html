{{ template "pagina" . }}

{{ define "body" }}
<div class="min-h-full w-full flex flex-col">
    {{ template "navbar" . }}

    <div class="w-full flex flex-col md:flex-row">
        <!-- form -->
        <div class="md:w-1/2 p-2 flex flex-col gap-2 border-2">
            <input id="nome" type="text"
                class="w-full px-3 py-2 rounded-md text-center focus:outline-none text-slate-700 uppercase" readonly>



            <textarea id="descricao" class="
                w-full px-3 py-2 rounded-md text-center 
                focus:outline-none text-slate-700 uppercase
                " rows="5"></textarea>

            <div class="flex gap-2">

                <button id="btnVoltar" class="
                        py-2 w-full rounded-md text-white font-black 
                        text-xl bg-blue-700
                    ">
                    <i class="bi bi-backspace-fill"></i> &nbsp;
                    Voltar
                </button>

                <button id="btnFinalizar" class="
                        py-4 w-full rounded-md text-white font-black 
                        text-xl bg-green-700
                    ">
                    <i class="bi bi-archive-fill"></i> &nbsp;
                    Finalizar
                </button>


            </div>

        </div>

        <!-- Tabela -->
        <div class="md:w-1/2  text-sm">
            {{ template "tabela"}}
        </div>
    </div>

</div>
<script src="/public/templates/atenderProcesso/atenderProcesso.js"></script>
{{ end }}


{{ define "thead" }}
<th style="width: 11%;">Cod.</th>
<th style="width: 33%;">Zona/User</th>
<th style="width: 34%;">Descricao</th>
<th style="width: 22%;">Entrada</th>

{{ end }}
