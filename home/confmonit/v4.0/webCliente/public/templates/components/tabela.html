{{ define "tabela" }}
<div class="overflow-x-auto">
    <div class="min-w-[360px]">
        <!--  -->
        <table id="tabela" class="w-full text-center border-separate bg-blue-100">
            <thead class="py-3 text-white font-black bg-blue-950">
                <tr>
                    {{ block "thead" . }}
                    {{end}}
                </tr>
            </thead>
            <tbody class="bg-zinc-500">
                {{ block "tbody" . }}

                {{ end }}
            </tbody>
        </table>
    </div>
</div>
{{ end }}
