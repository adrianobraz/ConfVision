{{ template "pagina" . }}

{{ define "body" }}
<div class="tech-page">
    {{ template "navbar" . }}

    <div class="tech-workspace">
        <!-- Listagem (esquerda) -->
        <section class="tech-col-list">
            <div class="tech-panel">
                <div class="tech-panel-head">
                    <i class="bi bi-table"></i> Listagem · Usuários
                </div>
                <div class="tech-panel-body">
                    <div class="bg-only hidden mb-2 px-1">
                        <label for="filtroCentral" class="ps-1">Filtrar por Central</label>
                        <select id="filtroCentral" class="w-full px-3 py-2 text-center"></select>
                    </div>
                    {{ template "tabela" }}
                </div>
            </div>
        </section>

        <!-- Cadastro (direita) -->
        <section class="tech-col-form">
            <div class="tech-panel">
                <div class="tech-panel-head">
                    <i class="bi bi-person-plus"></i> Cadastro · Usuário
                </div>
                <div class="tech-panel-body">
                    <div class="tech-form-block">
                        <div class="bg-only hidden mb-2">
                            <label for="formCentral" class="ps-1">Central</label>
                            <select id="formCentral" class="w-full px-3 py-2 text-center"></select>
                        </div>

                        <label for="nome" class="ps-1">Nome</label>
                        <input id="nome" type="text" placeholder="Digite o nome"
                            class="w-full px-3 py-2 uppercase text-center">

                        <div class="flex flex-col md:flex-row gap-2 mt-2">
                            <div class="md:w-2/3">
                                <label for="nick" class="ps-1">Nick</label>
                                <input id="nick" type="text" placeholder="Digite o nick"
                                    class="w-full px-3 py-2 uppercase text-center">
                            </div>
                            <div class="md:w-1/3">
                                <label for="usuarioVoip" class="ps-1">Usuario Voip</label>
                                <input id="usuarioVoip" type="text" placeholder="Usuario"
                                    class="w-full px-3 py-2 text-center">
                            </div>
                        </div>

                        <label for="email1" class="ps-1 mt-2 block">Email Principal</label>
                        <input id="email1" type="text" placeholder="Digite o email principal"
                            class="w-full px-3 py-2 lowercase text-center">

                        <label for="email2" class="ps-1 mt-2 block">Email Alternativo</label>
                        <input id="email2" type="text" placeholder="Digite o email alternativo"
                            class="w-full px-3 py-2 lowercase text-center">

                        <div class="flex flex-col md:flex-row gap-2 mt-2">
                            <div class="w-full">
                                <label for="telefone1" class="ps-1">Celular</label>
                                <input id="telefone1" type="text" placeholder="Digite o celular"
                                    class="w-full px-3 py-2 text-center mskCel">
                            </div>
                            <div class="w-full">
                                <label for="telefone2" class="ps-1">Telefone</label>
                                <input id="telefone2" type="text" placeholder="Digite o telefone"
                                    class="w-full px-3 py-2 text-center mskCel">
                            </div>
                        </div>
                    </div>

                    {{ template "btnLimparGravar"}}
                </div>
            </div>
        </section>
    </div>
</div>

<script src="/public/templates/centralUsuario/centralUsuario.js"></script>
{{ end }}


{{ define "thead" }}
<th class="py-2 col-central bg-only hidden">Central</th>
<th class="py-2 w-5/12">Nome</th>
<th class="py-2 w-2/12">Celular</th>
<th class="py-2 w-3/12" colspan="7">Ação</th>
{{end}}
