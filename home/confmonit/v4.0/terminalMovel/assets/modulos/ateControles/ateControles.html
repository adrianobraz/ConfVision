<link rel="stylesheet" href="/assets/modulos/ateControles/ateControles.css">

<div id="ateControles">
    <div id="ateControles_topRow">
        <div id="ateControles_cpTimer" class="bg-success"></div>
        <div class="click ateControles_btnCell" title="Discador" onclick="ateControles_abrirDiscador()">
            <div class="ateControles_btnBox rounded-3 fmt-botao border border-3 border-dark-subtle">
                <div class="p-2">
                    <i class="bi bi-telephone-fill"></i>
                </div>
            </div>
        </div>
    </div>

    <div id="ateControles_boxBotoes">
            <!-- Botao Eventos -->
            <div class="click ateControles_btnCell" title="Ver eventos do processo" onclick="ateControles_abrirEventos()">
                <div class="ateControles_btnBox rounded-3 fmt-botao border border-3 border-dark-subtle">
                    <div class="p-2">
                        <i class="bi bi-list-check"></i>
                    </div>
                </div>
            </div>
            <!-- /Botao Eventos -->

            <!-- Gerar ordem de serviço (primeiro ícone) -->
            <div class="click ateControles_btnCell" title="Gerar ordem de servico" onclick="ateControles_abrirOrdemServico()">
                <div class="ateControles_btnBox rounded-3 fmt-botao border border-3 border-dark-subtle">
                    <div class="p-2">
                        <i class="bi bi-tools"></i>
                    </div>
                </div>
            </div>
            <!-- /Gerar ordem de serviço -->

            <!-- Setores -->
            <div class="click ateControles_btnCell" title="Dados do setor do alarme" onclick="ateControles_abrirSetores()">
                <div class="ateControles_btnBox rounded-3 fmt-botao border border-3 border-dark-subtle">
                    <div class="p-2">
                        <i class="bi bi-diagram-3-fill"></i>
                    </div>

                </div>
            </div>
            <!-- /Setores -->

            <!-- Usuarios -->
            <div class="click ateControles_btnCell" title="Dados do usuarios do alarme" onclick="ateControles_abrirUsuarios()">
                <div class="ateControles_btnBox rounded-3 fmt-botao border border-3 border-dark-subtle">
                    <div class="p-2">
                        <i class="bi bi-people-fill"></i>
                    </div>
                </div>
            </div>
            <!-- /Usuarios -->

            <!-- Grade -->
            <div class="click ateControles_btnCell" title="Grade de horário" onclick="ateControles_abrirGrade()">
                <div class="ateControles_btnBox rounded-3 fmt-botao border border-3 border-dark-subtle">
                    <div class="p-2">
                        <i class="bi bi-alarm-fill"></i>
                    </div>
                </div>
            </div>
            <!-- /Grade -->

            <!-- Procedimento -->
            <div class="click ateControles_btnCell" title="Procedimento de atendimento"
                onclick="ateControles_abrirProcedimento()">
                <div class="ateControles_btnBox rounded-3 fmt-botao border border-3 border-dark-subtle">
                    <div class="p-2">
                        <i class="bi bi-book-half"></i>
                    </div>
                </div>
            </div>
            <!-- /Procedimento -->

            <!-- Tecnico -->
            <div class="click ateControles_btnCell" title="Dados do técnico" onclick="ateControles_abrirTecnico()">
                <div class="ateControles_btnBox rounded-3 fmt-botao border border-3 border-dark-subtle">
                    <div class="p-2">                        
                        <i class="bi bi-file-earmark-text"></i>
                    </div>
                </div>
            </div>
            <!-- /Tecnico -->

            <!-- Viatura -->
            <div class="click ateControles_btnCell" title="Dados da viatura" onclick="ateControles_abrirViatura()">
                <div class="ateControles_btnBox rounded-3 fmt-botao border border-3 border-dark-subtle">
                    <div class="p-2">
                        <i class="bi bi-taxi-front-fill"></i>
                    </div>
                </div>
            </div>
            <!-- /Viatura -->
    </div>
</div>
