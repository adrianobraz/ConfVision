<link
  rel="stylesheet"
  href="/assets/modulos/modEvtDesagrupado/modEvtDesagrupado.css"
/>

<div id="modEvtDesagrupado">
  <div id="modEvtDesagrupado_titulo">
    <h5 class="py-1">Eventos desagrupados</h5>
  </div>

  <div id="modEvtDesagrupado_fixos" class="table-responsive">
    <table class="table table-sm table-dark table-bordered align-middle mb-0">
      <thead>
        <tr>
          <th style="width: 18%">Zon/Usu</th>
          <th style="width: 8%">Part.</th>
          <th style="width: 30%">Descrição</th>
          <th style="width: 26%">Nome Set/Use</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td id="modEvtDesagrupado_cpZonaUser"></td>
          <td id="modEvtDesagrupado_cpParticao"></td>
          <td id="modEvtDesagrupado_cpDescricao"></td>
          <td id="modEvtDesagrupado_cpNomeZonaUser"></td>
        </tr>
      </tbody>
    </table>
  </div>

  <div id="modEvtDesagrupado_responsivo" class="table-responsive">
    <table class="table table-sm table-dark table-bordered align-middle">
      <thead>
        <tr>
          <th style="width: 70%">Entrada</th>
          <th style="width: 30%">Exibição gravação</th>
        </tr>
      </thead>

      <tbody></tbody>
    </table>
  </div>

  <div id="modEvtDesagrupado_camBox" class="px-2 pb-2 pt-1">
    <button
      id="modEvtDesagrupado_btnTempoReal"
      class="btn btn-success"
      type="button"
      title="Exibição tempo real"
    >
      <i class="bi bi-eye-fill"></i> Exibição tempo real
    </button>
  </div>

  <div id="modEvtDesagrupado_boxBtn">
    <button
      id="modEvtDesagrupado_btnFechar"
      class="btn btn-primary text-bg-primary fs-3"
    >
      <i class="bi bi-x-circle"></i>
      &nbsp; Fechar
    </button>
  </div>
</div>
