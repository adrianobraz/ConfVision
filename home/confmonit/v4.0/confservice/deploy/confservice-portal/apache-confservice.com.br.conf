# Exemplo Apache — confservice.com.br
# Destino dos arquivos estaticos: /home/confmonit/v4.0/confservice/web-dist
# API Go: 127.0.0.1:2020
#
# Depois do DNS:
#   1) Subir pasta dist/ para web-dist/
#   2) Copiar este arquivo para /etc/apache2/sites-available/confservice.com.br.conf
#   3) a2ensite confservice.com.br && systemctl reload apache2
#   4) certbot --apache -d confservice.com.br

<VirtualHost *:80>
    ServerName confservice.com.br
    ServerAlias www.confservice.com.br

    DocumentRoot /home/confmonit/v4.0/confservice/web-dist

    <Directory /home/confmonit/v4.0/confservice/web-dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        # SPA React
        FallbackResource /index.html
    </Directory>

    # API ConfService (nao deixar o FallbackResource engolir)
    ProxyPreserveHost On
    ProxyPass        /health              http://127.0.0.1:2020/health
    ProxyPassReverse /health              http://127.0.0.1:2020/health
    ProxyPass        /parceiro            http://127.0.0.1:2020/parceiro
    ProxyPassReverse /parceiro            http://127.0.0.1:2020/parceiro
    ProxyPass        /parceiros           http://127.0.0.1:2020/parceiros
    ProxyPassReverse /parceiros           http://127.0.0.1:2020/parceiros
    ProxyPass        /admin/              http://127.0.0.1:2020/admin/
    ProxyPassReverse /admin/              http://127.0.0.1:2020/admin/
    ProxyPass        /marketplace         http://127.0.0.1:2020/marketplace
    ProxyPassReverse /marketplace         http://127.0.0.1:2020/marketplace
    ProxyPass        /internal            http://127.0.0.1:2020/internal
    ProxyPassReverse /internal            http://127.0.0.1:2020/internal

    ErrorLog ${APACHE_LOG_DIR}/confservice-error.log
    CustomLog ${APACHE_LOG_DIR}/confservice-access.log combined
</VirtualHost>
