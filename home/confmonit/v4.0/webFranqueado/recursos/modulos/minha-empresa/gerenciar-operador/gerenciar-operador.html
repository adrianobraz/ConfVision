<!doctype html>
<html lang="pt-br">
    <head>
        {{ template "head" . }}
    </head>
    <body>
        {{ template "variaveis-controle" . }}
        {{ template "nav-bar" . }}
        <input id="id-operador" type="hidden" value="">
        {{ template "sub-menu-fluid" }}
        <div class="container-fluid container-principal">
            <div class="row text-center">
                <!-- COLUNA ESQUERDA -->
                <div id="coluna-direita" class="col-lg-6 mt-2">
                    <div class="table-responsive">
                        <table class="table table-bordered table-sm">
                            <thead class="table-dark">
                                <th style="width: 45%;">Nome</th>
                                <th style="width: 25%;">Celular</th>
                                <th colspan="4">Ações</th>

                            </thead>
                            <tbody><!-- preenchido por JS --></tbody>

                        </table>

                    </div>
                </div><!-- COLUNA ESQUERDA -->

                
                <!-- COLUNA DIREITA -->
                <div id="coluna-esquerda" class="col-lg-6 mt-2 bg-form">
                    <form id="formulario" class="p-4">
                        <div class="row">
                            <div class="col-lg-12 mb-1 text-start">
                                <label for="nome-operador"
                                    class="form-label">
                                    Nome:
                                </label>
                                <input type="text" autofocus maxlength="50"
                                    class="form-control form-control-sm text-uppercase"
                                    id="nome-operador">
                            </div>

                            <div class="col-lg-8 mb-1 text-start">
                                <label for="nick-operador"
                                    class="form-label">
                                    Nick:
                                </label>
                                <input type="text" maxlength="20"
                                    class="form-control form-control-sm text-uppercase"
                                    id="nick-operador">
                            </div>

                            <div class="col-lg-4 mb-1 text-start">
                                <label for="cpf-operador"
                                    class="form-label">
                                    CPF:
                                </label>
                                <input type="text" 
                                    class="form-control form-control-sm msk-cpf"
                                    id="cpf-operador">
                            </div>

                            <div class="col-lg-4 mb-1 text-start">
                                <label for="rg-operador"
                                    class="form-label">
                                    RG:
                                </label>
                                <input type="text" maxlength="15"
                                    class="form-control form-control-sm"
                                    id="rg-operador">
                            </div>

                            <div class="col-lg-3 mb-1 text-start">
                                <label for="cep-operador"
                                    class="form-label">
                                    CEP:
                                </label>
                                <input type="text"
                                    class="form-control form-control-sm msk-cep"
                                    id="cep-operador">
                            </div>

                            <div class="col-lg-5 mb-1 text-start">
                                <label for="uf-operador"
                                    class="form-label">
                                    UF:
                                </label>
                                <select class="form-control form-control-sm
                                carregarUf text-uppercase"
                                id="uf-operador"></select>
                            </div>

                            <div class="col-lg-9 mb-1 text-start">
                                <label for="endereco-operador"
                                    class="form-label">
                                    Endereço:
                                </label>
                                <input type="text" maxlength="50"
                                    class="form-control form-control-sm text-uppercase"
                                    id="endereco-operador">
                            </div>

                            <div class="col-lg-3 mb-1 text-start">
                                <label for="telefone-operador"
                                    class="form-label">
                                    Telefone:
                                </label>
                                <input type="text"
                                    class="form-control form-control-sm msk-telefone"
                                    id="telefone-operador">
                            </div>

                            <div class="col-lg-9 mb-1 text-start">
                                <label for="bairro-operador"
                                    class="form-label">
                                    Bairro:
                                </label>
                                <input type="text" maxlength="50"
                                    class="form-control form-control-sm text-uppercase"
                                    id="bairro-operador">
                            </div>

                            <div class="col-lg-3 mb-1 text-start">
                                <label for="celular-operador"
                                    class="form-label">
                                    Celular:
                                </label>
                                <input type="text"
                                    class="form-control form-control-sm msk-celular"
                                    id="celular-operador">
                            </div>

                            <div class="col-lg-6 mb-1 text-start">
                                <label for="cidade-operador"
                                    class="form-label">
                                    Cidade:
                                </label>
                                <input type="text" maxlength="50"
                                    class="form-control form-control-sm text-uppercase"
                                    id="cidade-operador">
                            </div>

                            <div class="col-lg-6 mb-1 text-start">
                                <label for="email-operador"
                                    class="form-label">
                                    Email:
                                </label>
                                <input type="email"
                                    class="form-control form-control-sm text-lowercase"
                                    id="email-operador">
                            </div>

                            <!-- CONTROLES -->
                            <div class="col-lg-12"><hr></div>
                            <div class="col-6 mb-3 d-grid gap-2 px-1">
                                <button id="btn-limpar"
                                    class="btn btn-lg btn-block btn-danger fs-2 py-4 py-lg-0"
                                    type="button">
                                    <i class="bi bi-eraser-fill fs-2"></i>
                                    &nbsp; Limpar
                                </button>
                            </div>
                            <div class="col-6 mb-3 d-grid gap-2 px-1">
                                <button id="btn-gravar"
                                    class="btn btn-lg btn-success fs-2 py-4 py-lg-0"
                                    type="button">
                                    <i class="bi bi-save-fill fs-2"></i>
                                    &nbsp; Gravar
                                </button>
                            </div>

                        </div>
                    </form>
                </div><!-- COLUNA DIREITA -->

                

            </div>
        </div>

        {{ template "link-js" . }}
        <script
            src="/recursos/modulos/minha-empresa/gerenciar-operador/gerenciar-operador.js"></script>
    </body>
</html>
