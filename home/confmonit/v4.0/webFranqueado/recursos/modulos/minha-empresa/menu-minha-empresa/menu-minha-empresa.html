<!doctype html>
<html lang="pt-br">

<head>
    {{ template "head" . }}
</head>

<body>
    {{ template "variaveis-controle" . }}
    {{ template "nav-bar" . }}

    {{ template "sub-menu" }}
    <div class="container container-principal">
        <div class="row text-center">

            <div class="col-lg-12">
                <hr>
            </div>

            <div id="botao-dados-monitoramento" class="col-6 col-lg-3 mb-3">
                <a href="/CarregarPaginaDadosMonitoramento">
                    <img src="/recursos/img/minhaempresa/dadosMonitoramento.png" alt="Dados do Monitoramento"
                        class="img-fluid rounded-3">
                </a>
            </div>

            <div id="botao-gerenciar-responsavel" class="col-6 col-lg-3 mb-3">
                <a href="/carregarPaginaGerenciarUsuarios">
                    <img src="/recursos/img/minhaempresa/responsaveis.png" alt="Gerenciar Responsaveis"
                        class="img-fluid rounded-3">
                </a>
            </div>

            <div id="botao-gerenciar-tecnico" class="col-6 col-lg-3 mb-3">
                <a href="/CarregarPaginaGerenciarTecnico">
                    <img src="/recursos/img/minhaempresa/cadastrarTecnico.png" alt="Cadastrar Tecnico"
                        class="img-fluid rounded-3">
                </a>
            </div>

            <div id="botao-gerenciar-cliente" class="col-6 col-lg-3 mb-3">
                <a href="/CarregarPaginaGerenciarCliente">
                    <img src="/recursos/img/minhaempresa/cadastrarCliente.png" alt="Cadastrar Cliente"
                        class="img-fluid rounded-3">
                </a>
            </div>

            <div id="botao-gerenciar-restricoes-tecnico" class="col-6 col-lg-3 mb-3">
                <a href="#">
                    <img src="/recursos/img/minhaempresa/restricoesTecnico.png" alt="Restrições ao Tecnico"
                        class="img-fluid rounded-3">
                </a>
            </div>

            <div id="botao-gerenciar-viatura" class="col-6 col-lg-3 mb-3">
                <a href="/CarregarPaginaGerenciarViatura">
                    <img src="/recursos/img/minhaempresa/cadastrarViatura.png" alt="Cadastrar Viaturas"
                        class="img-fluid rounded-3">
                </a>
            </div>

            <div id="botao-cadastro-operador" class="col-6 col-lg-3 mb-3" hidden="true">
                <a href="/CarregarPaginaGerenciarOperador">
                    <img src="/recursos/img/minhaempresa/cadastrarOperador.png" alt="Cadastrar Operador"
                        class="img-fluid rounded-3">
                </a>
            </div>

            <div id="botao-gerenciar-ticket" class="col-6 col-lg-3 mb-3">
                <a href="/CarregarPaginaGerenciarTicketFranqueado">
                    <img src="/recursos/img/atendimento/gerarOrdemServico.png" alt="Gerar Ordem Serviço"
                        class="img-fluid rounded-3">
                </a>
            </div>
            
            <!--############ GERENCIAR PACOTES ############-->
            <div id="btnGerenciarPacote" class="col-2 col-sm-3 col-6 botao">
                <div class="botaoFrame">
                    <i class="bi bi-box-seam"></i>
                    <br>Gerenciar
                    <br>Pacotes
                </div>

            </div>
            <!--###########################################-->
            <div class="col-lg-12">
                <hr>
            </div>

        </div>
    </div><!-- container -->

    {{ template "link-js" . }}
    <script src="/recursos/modulos/minha-empresa/menu-minha-empresa/menu-minha-empresa.js"></script>
</body>

</html>
