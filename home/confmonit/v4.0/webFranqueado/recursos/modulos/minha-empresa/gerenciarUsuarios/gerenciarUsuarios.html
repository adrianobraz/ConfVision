<!doctype html>
<html lang="pt-br">

<head>
    {{ template "head" . }}
</head>

<body>
    {{ template "variaveis-controle" . }}
    {{ template "nav-bar" . }}
    {{ template "sub-menu-fluid" }}
    <div class="container-fluid container-principal">
        <div class="row text-center">
            <!-- COLUNA ESQUERDA -->
            <div id="coluna-direita" class="col-lg-7 mt-2 altura-fixa table-responsive">

                <table class="table table-bordered table-sm ">
                    <thead class="table-dark">
                        <th>Nome</th>
                        <th style="width: 18%;">Celular</th>
                        <th style="width: 25%;" colspan="7">Ações</th>
                    </thead>
                    <tbody><!-- Preenchido via js --></tbody>
                </table>

            </div><!-- COLUNA ESQUERDA -->



            <!-- COLUNA DIREITA -->
            <div id="coluna-esquerda" class="col-lg-5 mt-2 bg-form altura-fixa table-responsive">
                <form id="formulario" class="p-4 ">
                    <div class="row">
                        <div class="col-lg-12 mb-1 text-start">
                            <label for="nome-responsavel" class="form-label mb-0">
                                Nome*:
                            </label>
                            <input type="text" autofocus maxlength="50" class="form-control form-control-sm
                                    text-uppercase" id="nome-responsavel">
                        </div>

                        <div class="col-lg-8 mb-1 text-start">
                            <label for="nick-responsavel" class="form-label mb-0">
                                Nick*:
                            </label>
                            <input type="text" maxlength="20" class="form-control form-control-sm
                                    text-uppercase" id="nick-responsavel">
                        </div>

                        <div class="col-lg-4 mb-1 text-start">
                            <label for="telefone_1-responsavel" class="form-label mb-0">
                                Telefone 1*:
                            </label>
                            <input type="text" class="form-control form-control-sm
                                    msk-telefone" id="telefone_1-responsavel">
                        </div>

                        <div class="col-lg-8 mb-1 text-start">
                            <label for="email_1-responsavel" class="form-label mb-0">
                                Email 1*:
                            </label>
                            <input type="email" class="form-control form-control-sm
                                    text-lowercase" id="email_1-responsavel">
                        </div>


                        <div class="col-lg-4 mb-1 text-start">
                            <label for="telefone_2-responsavel" class="form-label mb-0">
                                Telefone 2:
                            </label>
                            <input type="text" class="form-control form-control-sm
                                    msk-telefone" id="telefone_2-responsavel">
                        </div>

                        <div class="col-lg-8 mb-1 text-start">
                            <label for="email_2-responsavel" class="form-label mb-0">
                                Email 2:
                            </label>
                            <input type="email" class="form-control form-control-sm
                                    text-lowercase" id="email_2-responsavel">
                        </div>







                        <!-- CONTROLES -->
                        <div class="col-lg-12">
                            <hr>
                        </div>
                        <div class="col-6 mb-3 d-grid gap-2 px-1">
                            <button id="btn-limpar" class="btn btn-lg btn-block btn-danger fs-2
                                    py-4 py-lg-0" type="button">
                                <i class="bi bi-eraser-fill fs-2"></i>
                                &nbsp; Limpar
                            </button>
                        </div>
                        <div class="col-6 mb-3 d-grid gap-2 px-1">
                            <button id="btn-gravar" class="btn btn-lg btn-success fs-2 py-4
                                    py-lg-0" type="button">
                                <i class="bi bi-save-fill fs-2"></i>
                                &nbsp; Gravar
                            </button>
                        </div>

                    </div>
                </form>
            </div><!-- COLUNA DIREITA -->


        </div>
    </div>

    {{ template "link-js" . }}
    <script src="/recursos/modulos/minha-empresa/gerenciarUsuarios/gerenciarUsuarios.js"></script>
</body>

</html>
