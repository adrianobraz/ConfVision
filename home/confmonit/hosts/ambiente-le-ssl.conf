<IfModule mod_ssl.c>
<VirtualHost *:443>
	ServerName ambiente.confmonit2.com.br

	ProxyPreserveHost On
	RequestHeader set X-Forwarded-Proto "https"
	RequestHeader set X-Forwarded-Port "443"
	ProxyPass / http://127.0.0.1:8085/
	ProxyPassReverse / http://127.0.0.1:8085/

	ErrorLog ${APACHE_LOG_DIR}/ambiente_error.log
	CustomLog ${APACHE_LOG_DIR}/ambiente_access.log combined

	Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

	Include /etc/letsencrypt/options-ssl-apache.conf
	SSLCertificateFile /etc/letsencrypt/live/ambiente.confmonit2.com.br/fullchain.pem
	SSLCertificateKeyFile /etc/letsencrypt/live/ambiente.confmonit2.com.br/privkey.pem
</VirtualHost>
</IfModule>
