<VirtualHost *:80>
	ProxyPreserveHost On
	ProxyRequests Off
	ServerName admmonitoramento.com.br
	ServerAlias www.admmonitoramento.com.br
	Redirect / https://franqueado.confmonit.com.br:3002/	
	#ProxyPass /  http://localhost:3002/
	#ProxyPassReverse / http://localhost:300
RewriteEngine on
RewriteCond %{SERVER_NAME} =www.franqueado.confmonit.com.br [OR]
RewriteCond %{SERVER_NAME} =franqueado.confmonit.com.br
RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>



