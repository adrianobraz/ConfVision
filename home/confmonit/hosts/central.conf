<VirtualHost *:80>
	ServerName central.confmonit2.com.br
	ServerAlias www.central2.confmonit.com.br

	ServerAdmin suporte@kitsite.com.br
	DocumentRoot /var/www/html/

	<Directory /var/www/html/>
		Options FollowSymLinks
		AllowOverride All
	</Directory>	

	ErrorLog ${APACHE_LOG_DIR}/error.log
        CustomLog ${APACHE_LOG_DIR}/access.log combined
	
</VirtualHost>
