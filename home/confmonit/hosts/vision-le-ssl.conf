<IfModule mod_ssl.c>
<VirtualHost *:443>
	ServerName vision.confmonit2.com.br

	ProxyPreserveHost On
	RequestHeader set X-Forwarded-Proto "https"
	RequestHeader set X-Forwarded-Port "443"
	ProxyPass /live/ http://31.97.173.119:8888/live/
	ProxyPassReverse /live/ http://31.97.173.119:8888/live/
	ProxyPass / http://127.0.0.1:8086/
	ProxyPassReverse / http://127.0.0.1:8086/

	ErrorLog ${APACHE_LOG_DIR}/vision_error.log
	CustomLog ${APACHE_LOG_DIR}/vision_access.log combined

	Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

	Include /etc/letsencrypt/options-ssl-apache.conf
	SSLCertificateFile /etc/letsencrypt/live/vision.confmonit2.com.br/fullchain.pem
	SSLCertificateKeyFile /etc/letsencrypt/live/vision.confmonit2.com.br/privkey.pem
</VirtualHost>
</IfModule>
