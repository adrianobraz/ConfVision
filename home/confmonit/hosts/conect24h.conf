<VirtualHost *:80>
	ServerAdmin suporte@kitsite.com.br

	ServerName conect24h.com.br

	DocumentRoot /var/www/confinet/dev

	<Directory /var/www/confinet/dev/>
		Options FollowSymLinks
		AllowOverride All
	</Directory>

	LogLevel warn
	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined

</VirtualHost>

