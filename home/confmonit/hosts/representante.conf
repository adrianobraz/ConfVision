<VirtualHost *:80>
	ServerName nucleo.conect24h.com.br
#	ServerAlias www.nucleo.conect24h.com.br

	ServerAdmin suporte@kitsite.com.br
	DocumentRoot /var/www/html/

	<Directory /var/www/html/>
		Options FollowSymLinks
		AllowOverride All
	</Directory>	

	ErrorLog ${APACHE_LOG_DIR}/error.log
        CustomLog ${APACHE_LOG_DIR}/access.log combined
	
RewriteEngine on
RewriteCond %{SERVER_NAME} =nucleo.conect24h.com.br
RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
