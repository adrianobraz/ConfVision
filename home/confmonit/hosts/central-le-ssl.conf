<IfModule mod_ssl.c>
<VirtualHost *:443>
	ServerName central.confmonit.com.br
	ServerAlias www.central.confmonit.com.br

	ServerAdmin suporte@kitsite.com.br
	DocumentRoot /var/www/html/

	<Directory /var/www/html/>
		Options FollowSymLinks
		AllowOverride All
	</Directory>	

	ErrorLog ${APACHE_LOG_DIR}/error.log
        CustomLog ${APACHE_LOG_DIR}/access.log combined
	Redirect 301 / https://central.confmonit.com.br:4001	

SSLCertificateFile /etc/letsencrypt/live/central.confmonit.com.br/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/central.confmonit.com.br/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
