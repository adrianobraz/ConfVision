<VirtualHost *:80>
    ServerName terminalmovel.confmonit2.com.br

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:2007/
    ProxyPassReverse / http://127.0.0.1:2007/

    ErrorLog ${APACHE_LOG_DIR}/terminalmovel_error.log
    CustomLog ${APACHE_LOG_DIR}/terminalmovel_access.log combined
</VirtualHost>
