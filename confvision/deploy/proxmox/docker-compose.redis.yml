# Redis central ConfVision — rodar no core-4 (Proxmox)
# Uso:
#   cd /opt/confvision/redis
#   cp .env.example .env   # editar REDIS_PASSWORD
#   docker compose -f docker-compose.redis.yml up -d

services:
  redis:
    image: redis:7-alpine
    container_name: confvision-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - confvision_redis_data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  confvision_redis_data:
