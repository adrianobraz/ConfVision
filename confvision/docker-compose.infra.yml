# Infra local/teste — Redis + Postgres edge
# Uso: docker compose -f docker-compose.infra.yml up -d

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - confvision_redis:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: confvision
      POSTGRES_USER: confvision
      POSTGRES_PASSWORD: confvision
    volumes:
      - confvision_pg:/var/lib/postgresql/data
      - ./sql/001_edge_schema.sql:/docker-entrypoint-initdb.d/001_edge_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U confvision -d confvision"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  confvision_redis:
  confvision_pg:
