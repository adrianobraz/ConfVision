# MediaMTX — ConfVision (montar em /mediamtx.yml no EasyPanel)
# Volume compartilhado: /recordings -> confvision-recordings

logLevel: info
# stdout = EasyPanel | file = confvision-rtmp-guard (mesmo volume /recordings)
logDestinations: [stdout, file]
logFile: /recordings/mediamtx.log

api: yes
apiAddress: :9997

rtspAddress: :8554
rtmpAddress: :1935
hlsAddress: :8888
hlsAlwaysRemux: yes
rtspTransports: [tcp]

# Auth HTTP → confvision-rtmp-guard
# Publish: path cam/{hash12+} = Hashids(vis_camera.id), salt=RTMP_PUBLISH_SECRET
# Alfabeto 0-9a-z, min_length=12 — app fixo "cam"
# read/playback liberados (RTMP_ALLOW_READ_OPEN=1); api via user dvr
authMethod: http
authHTTPAddress: http://foxpro_confvision-rtmp-guard:8100/auth
authHTTPExclude:
  - read
  - playback

pathDefaults:
  source: publisher
  record: no

# Escala: qualquer cam/{hash12+} (não listar paths por câmera)
paths:
  all_others:
