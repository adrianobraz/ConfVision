# MediaMTX — ConfVision (montar em /mediamtx.yml no EasyPanel)
# Volume compartilhado: /recordings -> confvision-recordings

logLevel: info
# stdout = EasyPanel | file = confvision-rtmp-guard (mesmo volume /recordings)
logDestinations: [stdout, file]
logFile: /recordings/mediamtx.log

api: yes
apiAddress: :9997

rtspAddress: :8554
rtmpAddress: :1935
hlsAddress: :8888
hlsAlwaysRemux: yes
rtspTransports: [tcp]

# Auth HTTP → confvision-rtmp-guard (publish exige token + id_franqueado)
# read/playback liberados no guard (RTMP_ALLOW_READ_OPEN=1); api via user dvr
authMethod: http
authHTTPAddress: http://foxpro_confvision-rtmp-guard:8100/auth
authHTTPExclude: []

pathDefaults:
  source: publisher
  record: no

paths:
  live/1:
    record: yes
    recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S
    recordFormat: fmp4
    recordSegmentDuration: 5m
